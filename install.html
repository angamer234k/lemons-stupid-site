<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Bot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            background: #1a1b26;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #e4e5f0;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: #2a2b38;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .icon {
            font-size: 44px;
            color: #5865f2;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .message {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #c8c9d6;
            margin-bottom: 1rem;
        }

        .message strong {
            color: #fff;
        }

        .reason {
            background: #1e1f2a;
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            margin-bottom: 1.75rem;
            font-size: 0.95rem;
            color: #b0b1c4;
            border-left: 3px solid #5865f2;
            text-align: left;
        }

        .reason i {
            color: #5865f2;
            margin-right: 10px;
            width: 18px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #3a3b4a;
            color: #8e8fa3;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            border: none;
            cursor: not-allowed;
            pointer-events: none;
            user-select: none;
            width: 100%;
            max-width: 240px;
            margin: 0 auto 0.25rem;
        }

        .btn i {
            opacity: 0.5;
        }

        .note {
            font-size: 0.8rem;
            color: #6c6d82;
        }

        @media (max-width: 450px) {
            .card {
                padding: 1.75rem 1.25rem;
            }
            h1 {
                font-size: 1.35rem;
            }
            .message {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="icon"><i class="fab fa-discord"></i></div>

        <h1>Not for public install</h1>

        <p class="message">
            This bot is <strong>for my personal use only</strong> — it's not available for anyone else to install.
        </p>

        <div class="reason">
            <p><i class="fas fa-user"></i> Personal bot — just for my own server.</p>
            <p style="margin-top:6px;"><i class="fas fa-ban"></i> no public installation, no exceptions.</p>
        </div>

        <button class="btn" disabled>
            <i class="fas fa-lock"></i> Install disabled :P
        </button>
        <p class="note">no lol</p>

    </div>

</body>
</html>
