<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== DISCORD / SOCIAL EMBED META TAGS ===== -->
  <!-- Title & description (exactly as requested) -->
  <meta property="og:title" content="i use honeypot">
  <meta property="og:description" content="i use honeypot by RiskyMH, learn more on this site! (redirecter)">
  <meta property="og:type" content="website">
  <!-- Optional: set the actual URL so Discord knows where the link points -->
  <meta property="og:url" content="https://honeypot.riskymh.dev/">
  <!-- Optional: add a small default image so the embed looks nicer -->
  <meta property="og:image" content="https://honeypot.riskymh.dev/favicon.ico">
  <!-- Twitter card (Discord falls back to og: tags) -->
  <meta name="twitter:card" content="summary">

  <!-- ===== REDIRECT TO THE TARGET ===== -->
  <!-- Meta refresh (instant) -->
  <meta http-equiv="refresh" content="0; url=https://honeypot.riskymh.dev/">

  <title>Redirecting to honeypot.riskymh.dev</title>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 500px;
    }
    .card h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
    }
    .card p {
      color: #555;
      margin: 0.5rem 0;
    }
    .card a {
      color: #0066cc;
      text-decoration: none;
      font-weight: 500;
    }
    .card a:hover {
      text-decoration: underline;
    }
    .embed-preview {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 10px;
      border-left: 4px solid #5865f2;
      text-align: left;
      font-size: 0.9rem;
    }
    .embed-preview strong {
      display: block;
      color: #1e1e1e;
    }
    .embed-preview span {
      color: #3d3d3d;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>↪ Redirecting…</h1>
    <p>You are being sent to <strong>honeypot.riskymh.dev</strong>.</p>
    <p>If nothing happens, <a href="https://honeypot.riskymh.dev/">click here</a>.</p>

    <!-- Just a visual preview of how the embed will look in Discord -->
    <div class="embed-preview">
      <strong>📌 Discord embed preview</strong>
      <strong>i use honeypot</strong>
      <span>i use honeypot by RiskyMH, learn more on this site! (redirecter)</span>
    </div>
  </div>

  <!-- JavaScript fallback redirect (if meta refresh is blocked) -->
  <script>
    window.location.href = "https://honeypot.riskymh.dev/";
  </script>

</body>
</html>
