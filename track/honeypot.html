<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honeypot · Live Stats</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f17;
            color: #eef2f8;
            min-height: 100vh;
            padding: 24px;
            background-image: radial-gradient(circle at 20% 30%, #1a2744 0%, #0b0f17 70%);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #111a27;
        }
        ::-webkit-scrollbar-thumb {
            background: #3d4f6b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #586f8f;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ----- HEADER (glass) ----- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 28px;
            background: rgba(17, 25, 40, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            margin-bottom: 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatar-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(88, 101, 242, 0.4);
            padding: 2px;
            background: linear-gradient(145deg, #5865f2, #3b48c0);
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.2);
            transition: transform 0.25s ease;
        }
        .avatar-wrapper:hover {
            transform: scale(1.05);
        }
        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            object-fit: cover;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #f0f4ff, #a8c0e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }
        .brand .sub {
            font-size: 12px;
            color: #6a7f9a;
            margin-top: 2px;
            -webkit-text-fill-color: #6a7f9a;
            background: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(20, 30, 45, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .status-dot.online {
            background: #3ba55d;
            box-shadow: 0 0 16px rgba(59, 165, 93, 0.6);
        }
        .status-dot.connecting {
            background: #faa81a;
            box-shadow: 0 0 16px rgba(250, 168, 26, 0.6);
            animation: pulse 1s infinite;
        }
        .status-dot.offline {
            background: #ed4245;
            box-shadow: 0 0 16px rgba(237, 66, 69, 0.4);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .status-text {
            color: #8a9eb8;
        }
        .status-text strong {
            color: #eef2f8;
            font-weight: 500;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(145deg, #5865f2, #4752c4);
            color: #fff;
            box-shadow: 0 4px 16px rgba(88, 101, 242, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(88, 101, 242, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            color: #8a9eb8;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 11px;
            border-radius: 8px;
        }

        /* ----- STATS GRID (glass cards) ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(17, 25, 40, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px 20px 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5865f2, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-card:hover {
            border-color: rgba(88, 101, 242, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #6a7f9a;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #f0f4ff;
            letter-spacing: -0.2px;
            font-variant-numeric: tabular-nums;
        }
        .stat-value .unit {
            font-size: 14px;
            font-weight: 400;
            color: #6a7f9a;
            margin-left: 4px;
        }

        .stat-delta {
            font-size: 13px;
            font-weight: 500;
            padding: 0 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .stat-delta.positive {
            color: #3ba55d;
        }
        .stat-delta.negative {
            color: #ed4245;
        }
        .stat-delta.neutral {
            color: #6a7f9a;
        }
        .stat-delta .arrow {
            font-size: 10px;
        }

        /* ----- CHART SECTION (glass) ----- */
        .chart-section {
            background: rgba(17, 25, 40, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 22px 26px 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .chart-header h3 {
            font-size: 15px;
            font-weight: 500;
            color: #b0c4dc;
            letter-spacing: 0.2px;
        }

        .chart-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chart-controls .btn-chart {
            padding: 4px 16px;
            font-size: 11px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: #6a7f9a;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .chart-controls .btn-chart:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #eef2f8;
        }
        .chart-controls .btn-chart.active {
            background: #5865f2;
            border-color: #5865f2;
            color: #fff;
            box-shadow: 0 4px 16px rgba(88, 101, 242, 0.3);
        }

        .chart-wrapper {
            position: relative;
            height: 260px;
        }

        /* ----- LOG SECTION ----- */
        .log-section {
            background: rgba(17, 25, 40, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px 22px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .log-header h3 {
            font-size: 13px;
            font-weight: 500;
            color: #8a9eb8;
        }
        .log-header .count {
            font-size: 11px;
            color: #4a5f7a;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 12px;
            border-radius: 100px;
        }

        .log-container {
            max-height: 150px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.7;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .log-entry {
            display: flex;
            gap: 14px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #6a7f9a;
        }
        .log-entry .time {
            color: #4a5f7a;
            flex-shrink: 0;
            min-width: 72px;
            font-size: 10px;
        }
        .log-entry .data {
            color: #b8c8e0;
            word-break: break-all;
            font-size: 10px;
        }
        .log-empty {
            color: #4a5f7a;
            text-align: center;
            padding: 16px 0;
            font-size: 12px;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            body {
                padding: 14px;
            }
            .header {
                padding: 14px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-left {
                justify-content: center;
            }
            .header-right {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-card {
                padding: 14px 16px 12px;
            }
            .stat-value {
                font-size: 22px;
            }
            .chart-wrapper {
                height: 190px;
            }
            .chart-section {
                padding: 16px 16px 14px;
            }
            .log-container {
                font-size: 10px;
                padding: 6px 12px;
                max-height: 120px;
            }
            .log-entry {
                flex-direction: column;
                gap: 1px;
                padding: 4px 0;
            }
            .log-entry .time {
                min-width: auto;
                font-size: 9px;
            }
            .avatar-wrapper {
                width: 44px;
                height: 44px;
            }
            .brand h1 {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-value {
                font-size: 18px;
            }
            .header {
                padding: 12px 12px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 14px;
            }
            .stat-delta {
                font-size: 11px;
            }
        }

        .text-muted {
            color: #4a5f7a;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gap-1 {
            gap: 6px;
        }
        .glow {
            box-shadow: 0 0 40px rgba(88, 101, 242, 0.08);
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <div class="avatar-wrapper">
                    <img src="https://cdn.discordapp.com/attachments/894705593535852628/1526157712294150254/honeypot.png?ex=6a594c61&is=6a57fae1&hm=3d9e027d9edad280f01154aa5552fd088f30a8bc9956d7ed2f4cbf51f4177c7a&" alt="Bot avatar" />
                </div>
                <div class="brand">
                    <h1>Honeypot Stats</h1>
                    <div class="sub">live · wss://honeypot-stats.riskymh.dev/ws</div>
                </div>
            </div>
            <div class="header-right">
                <div class="status-badge">
                    <span class="status-dot offline" id="statusDot"></span>
                    <span class="status-text" id="statusText">
                        <strong id="statusLabel">Disconnected</strong>
                        <span id="statusDetail" class="text-muted"></span>
                    </span>
                </div>
                <button class="btn btn-primary" id="connectBtn">⟳ Connect</button>
                <button class="btn btn-outline btn-sm" id="clearLogBtn">Clear</button>
            </div>
        </header>

        <!-- ===== STATS GRID ===== -->
        <section class="stats-grid" id="statsGrid">
            <!-- injected -->
        </section>

        <!-- ===== CHART ===== -->
        <section class="chart-section" id="chartSection">
            <div class="chart-header">
                <h3 id="chartTitle">📈 Live metric</h3>
                <div class="chart-controls" id="chartControls">
                    <!-- injected -->
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="statsChart"></canvas>
            </div>
        </section>

        <!-- ===== LOG ===== -->
        <section class="log-section">
            <div class="log-header">
                <h3>📋 Log <span class="count" id="logCount">0</span></h3>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button class="btn btn-outline btn-sm" id="toggleLogBtn">Hide</button>
                </div>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-empty">No data yet</div>
            </div>
        </section>

    </div>

    <script>
        // ================================================================
        //  CONFIG
        // ================================================================
        const WS_URL = 'wss://honeypot-stats.riskymh.dev/ws';
        const MAX_LOG = 150;
        const MAX_CHART_POINTS = 140;

        // ================================================================
        //  STATE
        // ================================================================
        let ws = null;
        let isConnected = false;
        let isConnecting = false;
        let reconnectAttempt = 0;
        let reconnectTimer = null;
        let manualDisconnect = false;

        let history = [];
        let previousStats = {};
        let currentMetric = null;
        let chart = null;

        // DOM refs
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const statusDetail = document.getElementById('statusDetail');
        const connectBtn = document.getElementById('connectBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const toggleLogBtn = document.getElementById('toggleLogBtn');
        const logContainer = document.getElementById('logContainer');
        const logCount = document.getElementById('logCount');
        const statsGrid = document.getElementById('statsGrid');
        const chartControls = document.getElementById('chartControls');
        const chartTitle = document.getElementById('chartTitle');
        const canvas = document.getElementById('statsChart');

        let logVisible = true;

        // ================================================================
        //  STATUS HELPERS
        // ================================================================
        function setStatus(state, detail = '') {
            const dot = statusDot;
            const label = statusLabel;
            const detailEl = statusDetail;

            dot.className = 'status-dot';
            if (state === 'online') {
                dot.classList.add('online');
                label.textContent = 'Online';
                detailEl.textContent = detail || 'receiving';
            } else if (state === 'connecting') {
                dot.classList.add('connecting');
                label.textContent = 'Connecting…';
                detailEl.textContent = detail || `attempt ${reconnectAttempt + 1}`;
            } else {
                dot.classList.add('offline');
                label.textContent = 'Disconnected';
                detailEl.textContent = detail || 'waiting';
            }

            connectBtn.textContent = (state === 'online' || state === 'connecting') ? '● Disconnect' : '⟳ Connect';
            connectBtn.disabled = (state === 'connecting');
        }

        // ================================================================
        //  LOG
        // ================================================================
        function addLogEntry(data) {
            const time = new Date().toLocaleTimeString();
            history.push({ time, data });
            if (history.length > MAX_LOG) history.shift();
            renderLog();
        }

        function renderLog() {
            if (history.length === 0) {
                logContainer.innerHTML = `<div class="log-empty">No data yet</div>`;
                logCount.textContent = '0';
                return;
            }
            let html = '';
            const slice = history.slice(-MAX_LOG);
            for (const entry of slice) {
                const pretty = JSON.stringify(entry.data, null, 0);
                html += `<div class="log-entry">
                            <span class="time">${entry.time}</span>
                            <span class="data">${escapeHtml(pretty)}</span>
                        </div>`;
            }
            logContainer.innerHTML = html;
            logContainer.scrollTop = logContainer.scrollHeight;
            logCount.textContent = `${slice.length}`;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // ================================================================
        //  STATS CARDS with DELTAS
        // ================================================================
        function renderStats(data) {
            // Only show the fields we know exist
            const allowedKeys = ['guilds', 'moderations', 'last7dModerations', 'last7dEngagedGuilds'];
            const entries = allowedKeys
                .filter(k => data[k] !== undefined && data[k] !== null)
                .map(k => ({ key: k, value: data[k] }));

            if (entries.length === 0) {
                statsGrid.innerHTML =
                    `<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#4a5f7a;">No stats yet</div>`;
                return;
            }

            let html = '';
            for (const e of entries) {
                const val = typeof e.value === 'number' ? formatNumber(e.value) : e.value;
                const unit = typeof e.value === 'number' ? getUnit(e.key) : '';

                let deltaHtml = '';
                const prev = previousStats[e.key];
                if (prev !== undefined && typeof e.value === 'number' && typeof prev === 'number') {
                    const diff = e.value - prev;
                    const absDiff = Math.abs(diff);
                    if (absDiff > 0.001) {
                        const cls = diff > 0 ? 'positive' : 'negative';
                        const arrow = diff > 0 ? '↑' : '↓';
                        const displayDiff = diff > 0 ? `+${formatNumber(diff)}` : formatNumber(diff);
                        deltaHtml = `<span class="stat-delta ${cls}"><span class="arrow">${arrow}</span>${displayDiff}</span>`;
                    } else {
                        deltaHtml = `<span class="stat-delta neutral">—</span>`;
                    }
                } else {
                    deltaHtml = `<span class="stat-delta neutral" style="opacity:0.3;">—</span>`;
                }

                html += `
                        <div class="stat-card">
                            <div class="stat-label">${formatLabel(e.key)}</div>
                            <div class="stat-row">
                                <span class="stat-value">${val}<span class="unit">${unit}</span></span>
                                ${deltaHtml}
                            </div>
                        </div>
                    `;
            }
            statsGrid.innerHTML = html;

            // Update previous stats for next delta
            for (const e of entries) {
                if (typeof e.value === 'number') {
                    previousStats[e.key] = e.value;
                }
            }
        }

        function formatNumber(n) {
            if (Number.isInteger(n)) return n.toLocaleString();
            if (Math.abs(n) > 1000) return n.toFixed(1).toLocaleString();
            return n.toFixed(2);
        }

        function getUnit(key) {
            // no units for these specific keys, but keep generic
            return '';
        }

        function formatLabel(key) {
            return key
                .replace(/([A-Z])/g, ' $1')
                .replace(/_/g, ' ')
                .replace(/^./, s => s.toUpperCase())
                .trim();
        }

        // ================================================================
        //  CHART
        // ================================================================
        function getNumericKeys(data) {
            // Only use keys we know exist and are numbers
            const allowed = ['guilds', 'moderations', 'last7dModerations', 'last7dEngagedGuilds'];
            return allowed.filter(k =>
                typeof data[k] === 'number' && !isNaN(data[k]) && isFinite(data[k])
            );
        }

        function updateChartControls(keys) {
            if (keys.length === 0) {
                chartControls.innerHTML = `<span class="text-muted" style="font-size:12px;">no numeric data</span>`;
                chartTitle.textContent = '📈 Live metric';
                return;
            }
            if (!currentMetric || !keys.includes(currentMetric)) {
                currentMetric = keys[0];
            }

            let html = '';
            for (const k of keys) {
                const active = k === currentMetric ? 'active' : '';
                html += `<button class="btn-chart ${active}" data-key="${k}">${formatLabel(k)}</button>`;
            }
            chartControls.innerHTML = html;

            chartControls.querySelectorAll('.btn-chart').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.key;
                    if (key === currentMetric) return;
                    currentMetric = key;
                    chartControls.querySelectorAll('.btn-chart').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    chartTitle.textContent = `📈 ${formatLabel(key)}`;
                    rebuildChart();
                });
            });

            chartTitle.textContent = `📈 ${formatLabel(currentMetric)}`;
        }

        function rebuildChart() {
            if (!currentMetric) return;

            const labels = [];
            const values = [];
            const slice = history.slice(-MAX_CHART_POINTS);
            for (const entry of slice) {
                const v = entry.data[currentMetric];
                if (typeof v === 'number' && !isNaN(v) && isFinite(v)) {
                    labels.push(entry.time);
                    values.push(v);
                }
            }

            if (values.length < 2) {
                if (chart) { chart.destroy();
                    chart = null; }
                return;
            }

            const ctx = canvas.getContext('2d');
            if (chart) { chart.destroy();
                chart = null; }

            const min = Math.min(...values);
            const max = Math.max(...values);
            const range = max - min;
            const padding = range * 0.12 || 0.5;
            const yMin = Math.max(0, min - padding);
            const yMax = max + padding;

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: formatLabel(currentMetric),
                        data: values,
                        borderColor: '#5865f2',
                        backgroundColor: 'rgba(88,101,242,0.08)',
                        borderWidth: 2.8,
                        pointRadius: 2,
                        pointBackgroundColor: '#5865f2',
                        pointBorderColor: '#5865f2',
                        pointBorderWidth: 0,
                        pointHoverRadius: 5,
                        tension: 0.25,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(17,25,40,0.9)',
                            titleColor: '#eef2f8',
                            bodyColor: '#b0c4dc',
                            borderColor: 'rgba(255,255,255,0.06)',
                            borderWidth: 1,
                            cornerRadius: 10,
                            padding: 12,
                            callbacks: {
                                label: function(ctx) {
                                    let v = ctx.parsed.y;
                                    if (Number.isInteger(v)) return v.toLocaleString();
                                    return v.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(30,40,56,0.3)', drawBorder: false },
                            ticks: { color: '#4a5f7a', maxTicksLimit: 10, maxRotation: 28, font: { size: 9 } },
                        },
                        y: {
                            grid: { color: 'rgba(30,40,56,0.3)', drawBorder: false },
                            ticks: { color: '#4a5f7a', font: { size: 9 } },
                            min: yMin,
                            max: yMax,
                            beginAtZero: min > 0 ? false : true,
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'nearest',
                    },
                    animation: {
                        duration: 120,
                    },
                }
            });
        }

        function updateChart() {
            if (!currentMetric) return;
            rebuildChart();
        }

        // ================================================================
        //  DATA HANDLER
        // ================================================================
        function handleMessage(data) {
            renderStats(data);
            addLogEntry(data);

            const numericKeys = getNumericKeys(data);
            if (numericKeys.length > 0) {
                updateChartControls(numericKeys);
                updateChart();
            }

            const ts = data.timestamp || data.ts || data.time;
            if (ts) {
                const d = new Date(ts);
                if (!isNaN(d)) {
                    statusDetail.textContent = `last ${d.toLocaleTimeString()}`;
                }
            }
        }

        // ================================================================
        //  WEBSOCKET
        // ================================================================
        function connect() {
            if (isConnected || isConnecting) {
                disconnect();
                return;
            }
            manualDisconnect = false;
            reconnectAttempt = 0;
            doConnect();
        }

        function doConnect() {
            if (manualDisconnect || isConnected) return;
            isConnecting = true;
            setStatus('connecting', `attempt ${reconnectAttempt + 1}`);

            try {
                ws = new WebSocket(WS_URL);
                ws.onopen = onOpen;
                ws.onmessage = onMessage;
                ws.onclose = onClose;
                ws.onerror = onError;
            } catch (err) {
                console.error('WS error:', err);
                isConnecting = false;
                setStatus('offline', 'error');
                scheduleReconnect();
            }
        }

        function onOpen() {
            isConnected = true;
            isConnecting = false;
            reconnectAttempt = 0;
            setStatus('online', 'connected');
            if (reconnectTimer) { clearTimeout(reconnectTimer);
                reconnectTimer = null; }
        }

        function onMessage(e) {
            try {
                const data = JSON.parse(e.data);
                handleMessage(data);
            } catch (_) {
                try { handleMessage({ raw: e.data }); } catch (__) {}
            }
        }

        function onClose(event) {
            isConnected = false;
            isConnecting = false;
            setStatus('offline', event.reason || 'closed');
            if (ws) { ws = null; }
            if (!manualDisconnect) scheduleReconnect();
        }

        function onError(event) {
            // onclose follows
        }

        function disconnect() {
            manualDisconnect = true;
            if (reconnectTimer) { clearTimeout(reconnectTimer);
                reconnectTimer = null; }
            if (ws) { try { ws.close(1000, 'manual'); } catch (_) {} ws = null; }
            isConnected = false;
            isConnecting = false;
            setStatus('offline', 'disconnected');
        }

        function scheduleReconnect() {
            if (manualDisconnect || isConnected) return;
            const delay = [1000, 2000, 4000, 8000, 15000, 30000][Math.min(reconnectAttempt, 5)];
            reconnectAttempt++;
            if (reconnectTimer) { clearTimeout(reconnectTimer);
                reconnectTimer = null; }
            statusDetail.textContent = `reconnect in ${(delay/1000).toFixed(1)}s`;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                if (!manualDisconnect && !isConnected) doConnect();
            }, delay);
        }

        // ================================================================
        //  EVENT BINDING
        // ================================================================
        connectBtn.addEventListener('click', connect);

        clearLogBtn.addEventListener('click', () => {
            history = [];
            previousStats = {};
            renderLog();
            if (chart) { chart.destroy();
                chart = null; }
            chartControls.innerHTML = `<span class="text-muted" style="font-size:12px;">no data</span>`;
            chartTitle.textContent = '📈 Live metric';
            statsGrid.innerHTML =
                `<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#4a5f7a;">Waiting for data…</div>`;
        });

        toggleLogBtn.addEventListener('click', () => {
            logVisible = !logVisible;
            logContainer.style.display = logVisible ? 'block' : 'none';
            toggleLogBtn.textContent = logVisible ? 'Hide' : 'Show';
        });

        // ================================================================
        //  INIT
        // ================================================================
        setStatus('offline', 'ready');
        statsGrid.innerHTML =
            `<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#4a5f7a;">Click Connect to start</div>`;
        chartControls.innerHTML = `<span class="text-muted" style="font-size:12px;">connect to see metrics</span>`;

        // auto-connect after a moment
        setTimeout(() => connect(), 700);

        window.addEventListener('beforeunload', () => {
            if (ws) { try { ws.close(1000, 'unload'); } catch (_) {} }
            if (reconnectTimer) clearTimeout(reconnectTimer);
        });

        console.log('🔷 Honeypot Stats · live');
        console.log('📡', WS_URL);
    </script>

</body>
</html>
