<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Bot Stats · Live</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>

    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #080b12;
            color: #eef2f8;
            min-height: 100vh;
            padding: 24px;
        }

        /* ----- Scrollbar ----- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #111821;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3445;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4b60;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ----- Header ----- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 14px 24px;
            background: #111821;
            border-radius: 16px;
            border: 1px solid #1e2838;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(145deg, #5865f2, #4752c4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 14px rgba(88, 101, 242, 0.3);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: #f0f4ff;
        }
        .header h1 span {
            font-weight: 400;
            font-size: 13px;
            color: #5a6f8a;
            margin-left: 8px;
            letter-spacing: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ----- Status Badge (mini) ----- */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            background: #141d2a;
            border: 1px solid #1e2838;
            transition: all 0.3s;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: background 0.3s, box-shadow 0.3s;
            flex-shrink: 0;
        }
        .status-dot.online {
            background: #3ba55d;
            box-shadow: 0 0 14px rgba(59, 165, 93, 0.5);
        }
        .status-dot.connecting {
            background: #faa81a;
            box-shadow: 0 0 14px rgba(250, 168, 26, 0.5);
            animation: pulse 1s infinite;
        }
        .status-dot.offline {
            background: #ed4245;
            box-shadow: 0 0 14px rgba(237, 66, 69, 0.3);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }
        .status-text {
            color: #8a9eb8;
        }
        .status-text strong {
            color: #eef2f8;
            font-weight: 500;
        }

        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #5865f2;
            color: #fff;
        }
        .btn-primary:hover {
            background: #4752c4;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(88, 101, 242, 0.3);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            color: #8a9eb8;
            border: 1px solid #1e2838;
        }
        .btn-outline:hover {
            background: #141d2a;
            border-color: #2a3a4e;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
            border-radius: 6px;
        }

        /* ----- Stats Grid ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #111821;
            border: 1px solid #1a2436;
            border-radius: 14px;
            padding: 16px 18px 14px;
            transition: border-color 0.25s, box-shadow 0.25s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .stat-card:hover {
            border-color: #2a3a4e;
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.4);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #5a6f8a;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .stat-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 600;
            color: #f0f4ff;
            letter-spacing: -0.2px;
            font-variant-numeric: tabular-nums;
        }
        .stat-value .unit {
            font-size: 14px;
            font-weight: 400;
            color: #5a6f8a;
            margin-left: 4px;
        }

        .stat-delta {
            font-size: 13px;
            font-weight: 500;
            padding: 0 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            transition: all 0.3s;
        }
        .stat-delta.positive {
            color: #3ba55d;
        }
        .stat-delta.negative {
            color: #ed4245;
        }
        .stat-delta.neutral {
            color: #5a6f8a;
        }
        .stat-delta .arrow {
            font-size: 10px;
        }

        /* ----- Chart Section ----- */
        .chart-section {
            background: #111821;
            border: 1px solid #1a2436;
            border-radius: 16px;
            padding: 20px 22px 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }
        .chart-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: #8a9eb8;
        }

        .chart-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chart-controls .btn-chart {
            padding: 3px 14px;
            font-size: 11px;
            border-radius: 6px;
            border: 1px solid #1e2838;
            background: transparent;
            color: #6a7f9a;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .chart-controls .btn-chart:hover {
            background: #141d2a;
            color: #eef2f8;
        }
        .chart-controls .btn-chart.active {
            background: #5865f2;
            border-color: #5865f2;
            color: #fff;
        }

        .chart-wrapper {
            position: relative;
            height: 250px;
        }

        /* ----- Overlay Dot (status indicator over chart) ----- */
        .chart-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.6s ease, backdrop-filter 0.6s ease;
            border-radius: 12px;
            z-index: 10;
        }
        .chart-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .chart-overlay .blur-bg {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: rgba(8, 11, 18, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.6s ease;
        }
        .chart-overlay.hidden .blur-bg {
            opacity: 0;
        }

        .status-center {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.4s ease;
        }
        .chart-overlay.hidden .status-center {
            transform: scale(0.9);
            opacity: 0;
        }

        .status-center-dot {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 3px solid transparent;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }
        .status-center-dot.offline {
            background: rgba(237, 66, 69, 0.15);
            border-color: #ed4245;
            box-shadow: 0 0 40px rgba(237, 66, 69, 0.25);
        }
        .status-center-dot.offline::after {
            content: "✕";
            font-size: 24px;
            color: #ed4245;
        }
        .status-center-dot.connecting {
            background: rgba(250, 168, 26, 0.12);
            border-color: #faa81a;
            box-shadow: 0 0 40px rgba(250, 168, 26, 0.2);
            animation: pulse-ring 1.4s infinite;
        }
        .status-center-dot.connecting::after {
            content: "⟳";
            font-size: 26px;
            color: #faa81a;
            animation: spin 1.6s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse-ring {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(250, 168, 26, 0.15);
            }
            50% {
                box-shadow: 0 0 60px rgba(250, 168, 26, 0.35);
            }
        }
        .status-center-dot.online {
            background: rgba(59, 165, 93, 0.12);
            border-color: #3ba55d;
            box-shadow: 0 0 40px rgba(59, 165, 93, 0.2);
        }
        .status-center-dot.online::after {
            content: "✓";
            font-size: 26px;
            color: #3ba55d;
        }

        .status-center-label {
            font-size: 13px;
            font-weight: 500;
            color: #8a9eb8;
            background: rgba(8, 11, 18, 0.6);
            padding: 4px 16px;
            border-radius: 100px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- Log Section ----- */
        .log-section {
            background: #111821;
            border: 1px solid #1a2436;
            border-radius: 16px;
            padding: 14px 20px 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .log-header h3 {
            font-size: 13px;
            font-weight: 500;
            color: #6a7f9a;
        }
        .log-header .count {
            font-size: 11px;
            color: #4a5f7a;
            background: #080b12;
            padding: 2px 10px;
            border-radius: 100px;
        }

        .log-container {
            max-height: 140px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            line-height: 1.7;
            background: #080b12;
            border-radius: 10px;
            padding: 8px 14px;
            border: 1px solid #141d2a;
        }
        .log-entry {
            display: flex;
            gap: 14px;
            padding: 2px 0;
            border-bottom: 1px solid #0e141e;
            color: #6a7f9a;
        }
        .log-entry .time {
            color: #3a4f6a;
            flex-shrink: 0;
            min-width: 72px;
            font-size: 10px;
        }
        .log-entry .data {
            color: #b8c8e0;
            word-break: break-all;
            overflow-wrap: anywhere;
            font-size: 10px;
        }
        .log-empty {
            color: #3a4f6a;
            text-align: center;
            padding: 16px 0;
            font-size: 12px;
        }

        /* ----- Responsive ----- */
        @media (max-width: 768px) {
            body {
                padding: 14px;
            }
            .header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-left {
                justify-content: center;
            }
            .header-right {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 12px 14px 10px;
            }
            .stat-value {
                font-size: 20px;
            }
            .chart-wrapper {
                height: 180px;
            }
            .chart-section {
                padding: 14px 14px 12px;
            }
            .log-container {
                font-size: 10px;
                padding: 6px 10px;
                max-height: 110px;
            }
            .log-entry {
                flex-direction: column;
                gap: 1px;
                padding: 3px 0;
            }
            .log-entry .time {
                min-width: auto;
                font-size: 9px;
                color: #3a4f6a;
            }
            .status-center-dot {
                width: 44px;
                height: 44px;
            }
            .status-center-dot::after {
                font-size: 18px !important;
            }
            .status-center-label {
                font-size: 11px;
                padding: 2px 12px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-value {
                font-size: 17px;
            }
            .header h1 {
                font-size: 16px;
            }
            .header h1 span {
                font-size: 11px;
                display: block;
                margin-left: 0;
            }
            .btn {
                font-size: 11px;
                padding: 5px 12px;
            }
            .stat-delta {
                font-size: 11px;
            }
        }

        .text-muted {
            color: #4a5f7a;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gap-1 {
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <div class="logo-icon">◆</div>
                <h1>Bot Stats <span>wss://honeypot-stats.riskymh.dev/ws</span></h1>
            </div>
            <div class="header-right">
                <div class="status-badge">
                    <span class="status-dot offline" id="statusDot"></span>
                    <span class="status-text" id="statusText">
                        <strong id="statusLabel">Disconnected</strong>
                        <span id="statusDetail" class="text-muted" style="font-weight:400;"></span>
                    </span>
                </div>
                <button class="btn btn-primary" id="connectBtn">⟳ Connect</button>
                <button class="btn btn-outline btn-sm" id="clearLogBtn">Clear</button>
            </div>
        </header>

        <!-- ===== STATS GRID ===== -->
        <section class="stats-grid" id="statsGrid">
            <!-- injected -->
        </section>

        <!-- ===== CHART ===== -->
        <section class="chart-section" id="chartSection">
            <div class="chart-header">
                <h3 id="chartTitle">📈 Live metric</h3>
                <div class="chart-controls" id="chartControls">
                    <!-- injected -->
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="statsChart"></canvas>

                <!-- overlay status dot -->
                <div class="chart-overlay" id="chartOverlay">
                    <div class="blur-bg"></div>
                    <div class="status-center">
                        <div class="status-center-dot offline" id="centerDot"></div>
                        <span class="status-center-label" id="centerLabel">Awaiting connection</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== LOG ===== -->
        <section class="log-section">
            <div class="log-header">
                <h3>📋 Log <span class="count" id="logCount">0</span></h3>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button class="btn btn-outline btn-sm" id="toggleLogBtn">Hide</button>
                </div>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-empty">No data yet</div>
            </div>
        </section>

    </div>

    <script>
        // ================================================================
        //  CONFIG
        // ================================================================
        const WS_URL = 'wss://honeypot-stats.riskymh.dev/ws';
        const MAX_LOG = 150;
        const MAX_CHART_POINTS = 140;

        // ================================================================
        //  STATE
        // ================================================================
        let ws = null;
        let isConnected = false;
        let isConnecting = false;
        let reconnectAttempt = 0;
        let reconnectTimer = null;
        let manualDisconnect = false;

        let history = []; // [{ time, data }]
        let previousStats = {}; // for delta tracking
        let currentMetric = null;
        let chart = null;

        // DOM
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const statusDetail = document.getElementById('statusDetail');
        const connectBtn = document.getElementById('connectBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const toggleLogBtn = document.getElementById('toggleLogBtn');
        const logContainer = document.getElementById('logContainer');
        const logCount = document.getElementById('logCount');
        const statsGrid = document.getElementById('statsGrid');
        const chartControls = document.getElementById('chartControls');
        const chartTitle = document.getElementById('chartTitle');
        const canvas = document.getElementById('statsChart');
        const chartOverlay = document.getElementById('chartOverlay');
        const centerDot = document.getElementById('centerDot');
        const centerLabel = document.getElementById('centerLabel');

        let logVisible = true;

        // ================================================================
        //  STATUS HELPERS
        // ================================================================
        function setStatus(state, detail = '') {
            const dot = statusDot;
            const label = statusLabel;
            const detailEl = statusDetail;

            dot.className = 'status-dot';
            centerDot.className = 'status-center-dot';

            if (state === 'online') {
                dot.classList.add('online');
                label.textContent = 'Online';
                detailEl.textContent = detail || 'receiving';
                centerDot.classList.add('online');
                centerLabel.textContent = 'Connected · live';
                chartOverlay.classList.add('hidden');
            } else if (state === 'connecting') {
                dot.classList.add('connecting');
                label.textContent = 'Connecting…';
                detailEl.textContent = detail || `attempt ${reconnectAttempt + 1}`;
                centerDot.classList.add('connecting');
                centerLabel.textContent = `Connecting… ${detail || ''}`;
                chartOverlay.classList.remove('hidden');
            } else {
                dot.classList.add('offline');
                label.textContent = 'Disconnected';
                detailEl.textContent = detail || 'waiting';
                centerDot.classList.add('offline');
                centerLabel.textContent = detail || 'Disconnected';
                chartOverlay.classList.remove('hidden');
            }

            connectBtn.textContent = (state === 'online' || state === 'connecting') ? '● Disconnect' : '⟳ Connect';
            connectBtn.disabled = (state === 'connecting');
        }

        // ================================================================
        //  LOG
        // ================================================================
        function addLogEntry(data) {
            const time = new Date().toLocaleTimeString();
            history.push({ time, data });
            if (history.length > MAX_LOG) history.shift();
            renderLog();
        }

        function renderLog() {
            if (history.length === 0) {
                logContainer.innerHTML = `<div class="log-empty">No data yet</div>`;
                logCount.textContent = '0';
                return;
            }
            let html = '';
            const slice = history.slice(-MAX_LOG);
            for (const entry of slice) {
                const pretty = JSON.stringify(entry.data, null, 0);
                html += `<div class="log-entry">
                            <span class="time">${entry.time}</span>
                            <span class="data">${escapeHtml(pretty)}</span>
                        </div>`;
            }
            logContainer.innerHTML = html;
            logContainer.scrollTop = logContainer.scrollHeight;
            logCount.textContent = `${slice.length}`;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // ================================================================
        //  STATS CARDS with DELTAS
        // ================================================================
        function renderStats(data) {
            const keys = Object.keys(data).filter(k =>
                typeof data[k] !== 'object' && data[k] !== null && data[k] !== undefined
            );

            if (keys.length === 0) {
                statsGrid.innerHTML =
                    `<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#4a5f7a;">No numeric stats</div>`;
                return;
            }

            // pick displayable: numbers or short strings
            const entries = keys
                .map(k => ({ key: k, value: data[k] }))
                .filter(e => typeof e.value === 'number' || (typeof e.value === 'string' && e.value.length < 18));

            if (entries.length === 0) {
                statsGrid.innerHTML =
                    `<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#4a5f7a;">No displayable stats</div>`;
                return;
            }

            let html = '';
            for (const e of entries) {
                const val = typeof e.value === 'number' ? formatNumber(e.value) : e.value;
                const unit = typeof e.value === 'number' ? getUnit(e.key) : '';

                // compute delta
                let deltaHtml = '';
                const prev = previousStats[e.key];
                if (prev !== undefined && typeof e.value === 'number' && typeof prev === 'number') {
                    const diff = e.value - prev;
                    const absDiff = Math.abs(diff);
                    if (absDiff > 0.001) {
                        const cls = diff > 0 ? 'positive' : 'negative';
                        const arrow = diff > 0 ? '↑' : '↓';
                        const displayDiff = diff > 0 ? `+${formatNumber(diff)}` : formatNumber(diff);
                        deltaHtml = `<span class="stat-delta ${cls}"><span class="arrow">${arrow}</span>${displayDiff}</span>`;
                    } else {
                        deltaHtml = `<span class="stat-delta neutral">—</span>`;
                    }
                } else {
                    deltaHtml = `<span class="stat-delta neutral" style="opacity:0.3;">—</span>`;
                }

                html += `
                        <div class="stat-card">
                            <div class="stat-label">${formatLabel(e.key)}</div>
                            <div class="stat-row">
                                <span class="stat-value">${val}<span class="unit">${unit}</span></span>
                                ${deltaHtml}
                            </div>
                        </div>
                    `;
            }
            statsGrid.innerHTML = html;

            // update previous for next tick
            for (const e of entries) {
                if (typeof e.value === 'number') {
                    previousStats[e.key] = e.value;
                }
            }
        }

        function formatNumber(n) {
            if (Number.isInteger(n)) return n.toLocaleString();
            if (Math.abs(n) > 1000) return n.toFixed(1).toLocaleString();
            return n.toFixed(2);
        }

        function getUnit(key) {
            const k = key.toLowerCase();
            if (k.includes('percent') || k.includes('pct')) return '%';
            if (k.includes('memory') || k.includes('ram') || k.includes('mb')) return 'MB';
            if (k.includes('cpu')) return '%';
            if (k.includes('ms') || k.includes('ping') || k.includes('latency')) return 'ms';
            if (k.includes('seconds') || k.includes('uptime')) return 's';
            if (k.includes('guild') || k.includes('server')) return '';
            if (k.includes('member') || k.includes('user')) return '';
            return '';
        }

        function formatLabel(key) {
            return key
                .replace(/([A-Z])/g, ' $1')
                .replace(/_/g, ' ')
                .replace(/^./, s => s.toUpperCase())
                .trim();
        }

        // ================================================================
        //  CHART
        // ================================================================
        function getNumericKeys(data) {
            return Object.keys(data).filter(k =>
                typeof data[k] === 'number' && !isNaN(data[k]) && isFinite(data[k])
            );
        }

        function updateChartControls(keys) {
            if (keys.length === 0) {
                chartControls.innerHTML = `<span class="text-muted" style="font-size:12px;">no numeric data</span>`;
                chartTitle.textContent = '📈 Live metric';
                return;
            }
            if (!currentMetric || !keys.includes(currentMetric)) {
                currentMetric = keys[0];
            }

            let html = '';
            for (const k of keys) {
                const active = k === currentMetric ? 'active' : '';
                html += `<button class="btn-chart ${active}" data-key="${k}">${formatLabel(k)}</button>`;
            }
            chartControls.innerHTML = html;

            chartControls.querySelectorAll('.btn-chart').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.key;
                    if (key === currentMetric) return;
                    currentMetric = key;
                    chartControls.querySelectorAll('.btn-chart').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    chartTitle.textContent = `📈 ${formatLabel(key)}`;
                    rebuildChart();
                });
            });

            chartTitle.textContent = `📈 ${formatLabel(currentMetric)}`;
        }

        function rebuildChart() {
            if (!currentMetric) return;

            const labels = [];
            const values = [];
            const slice = history.slice(-MAX_CHART_POINTS);
            for (const entry of slice) {
                const v = entry.data[currentMetric];
                if (typeof v === 'number' && !isNaN(v) && isFinite(v)) {
                    labels.push(entry.time);
                    values.push(v);
                }
            }

            if (values.length < 2) {
                if (chart) { chart.destroy();
                    chart = null; }
                return;
            }

            const ctx = canvas.getContext('2d');
            if (chart) { chart.destroy();
                chart = null; }

            // find min/max to make variations visible
            const min = Math.min(...values);
            const max = Math.max(...values);
            const range = max - min;
            const padding = range * 0.12 || 0.5;
            const yMin = Math.max(0, min - padding);
            const yMax = max + padding;

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: formatLabel(currentMetric),
                        data: values,
                        borderColor: '#5865f2',
                        backgroundColor: 'rgba(88,101,242,0.07)',
                        borderWidth: 2.8,
                        pointRadius: 2,
                        pointBackgroundColor: '#5865f2',
                        pointBorderColor: '#5865f2',
                        pointBorderWidth: 0,
                        pointHoverRadius: 5,
                        tension: 0.25,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#111821',
                            titleColor: '#eef2f8',
                            bodyColor: '#b0c4dc',
                            borderColor: '#1e2838',
                            borderWidth: 1,
                            cornerRadius: 8,
                            padding: 10,
                            callbacks: {
                                label: function(ctx) {
                                    let v = ctx.parsed.y;
                                    if (Number.isInteger(v)) return v.toLocaleString();
                                    return v.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(30,40,56,0.3)', drawBorder: false },
                            ticks: { color: '#4a5f7a', maxTicksLimit: 10, maxRotation: 28, font: { size: 9 } },
                        },
                        y: {
                            grid: { color: 'rgba(30,40,56,0.3)', drawBorder: false },
                            ticks: { color: '#4a5f7a', font: { size: 9 } },
                            min: yMin,
                            max: yMax,
                            beginAtZero: min > 0 ? false : true,
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'nearest',
                    },
                    animation: {
                        duration: 120,
                    },
                }
            });
        }

        function updateChart() {
            if (!currentMetric) return;
            rebuildChart();
        }

        // ================================================================
        //  DATA HANDLER
        // ================================================================
        function handleMessage(data) {
            // update stats with deltas
            renderStats(data);

            // log
            addLogEntry(data);

            // chart
            const numericKeys = getNumericKeys(data);
            if (numericKeys.length > 0) {
                updateChartControls(numericKeys);
                updateChart();
            }

            // status detail
            const ts = data.timestamp || data.ts || data.time;
            if (ts) {
                const d = new Date(ts);
                if (!isNaN(d)) {
                    statusDetail.textContent = `last ${d.toLocaleTimeString()}`;
                }
            }
        }

        // ================================================================
        //  WEBSOCKET
        // ================================================================
        function connect() {
            if (isConnected || isConnecting) {
                disconnect();
                return;
            }
            manualDisconnect = false;
            reconnectAttempt = 0;
            doConnect();
        }

        function doConnect() {
            if (manualDisconnect || isConnected) return;
            isConnecting = true;
            setStatus('connecting', `attempt ${reconnectAttempt + 1}`);

            try {
                ws = new WebSocket(WS_URL);
                ws.onopen = onOpen;
                ws.onmessage = onMessage;
                ws.onclose = onClose;
                ws.onerror = onError;
            } catch (err) {
                console.error('WS error:', err);
                isConnecting = false;
                setStatus('offline', 'error');
                scheduleReconnect();
            }
        }

        function onOpen() {
            isConnected = true;
            isConnecting = false;
            reconnectAttempt = 0;
            setStatus('online', 'connected');
            if (reconnectTimer) { clearTimeout(reconnectTimer);
                reconnectTimer = null; }
        }

        function onMessage(e) {
            try {
                const data = JSON.parse(e.data);
                handleMessage(data);
            } catch (_) {
                try { handleMessage({ raw: e.data }); } catch (__) {}
            }
        }

        function onClose(event) {
            isConnected = false;
            isConnecting = false;
            setStatus('offline', event.reason || 'closed');
            if (ws) { ws = null; }
            if (!manualDisconnect) scheduleReconnect();
        }

        function onError(event) {
            // onclose follows
        }

        function disconnect() {
            manualDisconnect = true;
            if (reconnectTimer) { clearTimeout(reconnectTimer);
                reconnectTimer = null; }
            if (ws) { try { ws.close(1000, 'manual'); } catch (_) {} ws = null; }
            isConnected = false;
            isConnecting = false;
            setStatus('offline', 'disconnected');
        }

        function scheduleReconnect() {
            if (manualDisconnect || isConnected) return;
            const delay = [1000, 2000, 4000, 8000, 15000, 30000][Math.min(reconnectAttempt, 5)];
            reconnectAttempt++;
            if (reconnectTimer) { clearTimeout(reconnectTimer);
                reconnectTimer = null; }
            statusDetail.textContent = `reconnect in ${(delay/1000).toFixed(1)}s`;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                if (!manualDisconnect && !isConnected) doConnect();
            }, delay);
        }

        // ================================================================
        //  EVENT BINDING
        // ================================================================
        connectBtn.addEventListener('click', connect);

        clearLogBtn.addEventListener('click', () => {
            history = [];
            previousStats = {};
            renderLog();
            if (chart) { chart.destroy();
                chart = null; }
            chartControls.innerHTML = `<span class="text-muted" style="font-size:12px;">no data</span>`;
            chartTitle.textContent = '📈 Live metric';
            statsGrid.innerHTML =
                `<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#4a5f7a;">Waiting for data…</div>`;
        });

        toggleLogBtn.addEventListener('click', () => {
            logVisible = !logVisible;
            logContainer.style.display = logVisible ? 'block' : 'none';
            toggleLogBtn.textContent = logVisible ? 'Hide' : 'Show';
        });

        // ================================================================
        //  INIT
        // ================================================================
        setStatus('offline', 'ready');
        statsGrid.innerHTML =
            `<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#4a5f7a;">Click Connect to start</div>`;
        chartControls.innerHTML = `<span class="text-muted" style="font-size:12px;">connect to see metrics</span>`;

        // auto-connect after a moment
        setTimeout(() => connect(), 700);

        window.addEventListener('beforeunload', () => {
            if (ws) { try { ws.close(1000, 'unload'); } catch (_) {} }
            if (reconnectTimer) clearTimeout(reconnectTimer);
        });

        console.log('🔷 Bot Stats Tracker · live');
        console.log('📡', WS_URL);
    </script>

</body>
</html>
