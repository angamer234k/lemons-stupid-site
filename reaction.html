<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>reaction · lemon</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#0a0a0b;font-family:Inter,system-ui,sans-serif;user-select:none;touch-action:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
.back{color:#a1a1aa;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 12px;border-radius:999px;border:1px solid #27272a;background:#111113}
.title{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fde047}
.meta{font-size:.8rem;font-weight:600;color:#a1a1aa}.meta span{color:#fde047}
.zone{flex:1;display:flex;align-items:center;justify-content:center;margin:12px;border-radius:20px;border:1px solid #27272a;cursor:pointer;transition:background .1s}
.zone.wait{background:#18181b}.zone.ready{background:#14532d;border-color:#4ade80}.zone.early{background:#7f1d1d;border-color:#f87171}
.zone .msg{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:#fde047;text-align:center;padding:20px}
.zone.ready .msg{color:#4ade80}.zone.early .msg{color:#fca5a5}
</style></head><body>
<header><a class="back" href="/games.html">← games</a><div class="title">reaction</div><div class="meta">best <span id="be">—</span></div></header>
<div class="zone wait" id="z"><div class="msg" id="m">tap to start</div></div>
<script>
(function(){
const KEY='lemon-reaction-best';let best=+localStorage.getItem(KEY)||0;
if(best)document.getElementById('be').textContent=best+' ms';
const z=document.getElementById('z'),m=document.getElementById('m');
let state='idle',t0=0,timer=null;
function start(){state='wait';z.className='zone wait';m.textContent='wait for green…';
clearTimeout(timer);timer=setTimeout(()=>{state='go';z.className='zone ready';m.textContent='TAP!';t0=performance.now()},1500+Math.random()*2500)}
z.addEventListener('pointerdown',()=>{
  if(state==='idle'||state==='done'||state==='early'){start();return}
  if(state==='wait'){clearTimeout(timer);state='early';z.className='zone early';m.textContent='too early!\ntap to retry';return}
  if(state==='go'){const ms=Math.round(performance.now()-t0);state='done';z.className='zone wait';
  m.textContent=ms+' ms\ntap to try again';if(!best||ms<best){best=ms;localStorage.setItem(KEY,best);document.getElementById('be').textContent=best+' ms'}}
})})();
</script></body></html>
