<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>invite admin</title>

  <link href="https://fonts.googleapis.com/css2?family=Lemon&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #1e1e2a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Arial', 'Helvetica', sans-serif;
      padding: 20px;
      padding-top: 40px;
    }

    .card-wrapper {
      width: 85vw;
      max-width: 520px;
      padding: 3px;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .card {
      width: 100%;
      background-color: #67809f;
      border-radius: 13px;
      padding: 28px 22px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .lemon-heading {
      font-family: 'Lemon', cursive, 'Comic Sans MS', sans-serif;
      font-size: 2rem;
      color: #fdff94;
      text-shadow:
        -2px -2px 0 #535353,
         2px -2px 0 #535353,
        -2px  2px 0 #535353,
         2px  2px 0 #535353;
      text-align: center;
    }

    .subtitle {
      color: #ffffff;
      font-weight: bold;
      font-size: 0.95rem;
      opacity: 0.9;
      text-align: center;
    }

    label {
      color: #ffe77f;
      font-weight: bold;
      font-size: 0.85rem;
      align-self: flex-start;
      width: 100%;
    }

    input, select {
      width: 100%;
      background: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      padding: 11px 14px;
      font-family: inherit;
      outline: none;
    }

    input:focus, select:focus { border-color: #6b8fc7; }

    button {
      height: 42px;
      background: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 50px;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 0 18px;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
    }

    button:hover:not(:disabled) {
      background: #3e4d5e;
      border-color: #6b8fc7;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.danger {
      border-color: #f87171;
      color: #f87171;
      width: auto;
      height: 32px;
      font-size: 0.8rem;
      padding: 0 12px;
    }

    button.danger:hover:not(:disabled) {
      background: #3e2c2c;
      border-color: #fca5a5;
    }

    .status {
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      min-height: 1.3em;
      width: 100%;
    }

    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }

    .link-box {
      width: 100%;
      background: #2c3744;
      border: 2px solid #4ade80;
      border-radius: 10px;
      padding: 12px;
      color: #4ade80;
      font-size: 0.85rem;
      word-break: break-all;
      display: none;
    }

    .link-box.visible { display: block; }

    .hidden { display: none !important; }

    .section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .token-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .token-item {
      background: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .token-id {
      font-family: monospace;
      font-size: 0.75rem;
      color: #cbd5e1;
      word-break: break-all;
    }

    .token-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .token-ttl {
      font-size: 0.8rem;
      color: #ffe77f;
      font-weight: bold;
    }

    .token-link {
      font-size: 0.75rem;
      color: #6b8fc7;
      word-break: break-all;
      text-decoration: none;
    }

    .token-link:hover { color: #ffe77f; }

    .empty {
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
      padding: 12px;
    }

    .back {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: bold;
    }

    .back:hover { color: #ffe77f; }

    h3 {
      color: #ffffff;
      font-size: 1rem;
      align-self: flex-start;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <div class="lemon-heading">invite admin</div>
    <div class="subtitle">manage message invite tokens</div>

    <!-- Login -->
    <div class="section" id="login-section">
      <label for="password">password</label>
      <input type="password" id="password" placeholder="ONLINE_SECRET" autocomplete="off" />
      <button id="login-btn">unlock</button>
      <div class="status" id="login-status"></div>
    </div>

    <!-- Main panel -->
    <div class="section hidden" id="main-section">

      <label for="duration">duration</label>
      <select id="duration">
        <option value="">Permanent</option>
        <option value="3600">1 hour</option>
        <option value="21600">6 hours</option>
        <option value="86400">1 day</option>
        <option value="259200">3 days</option>
        <option value="604800">7 days</option>
        <option value="2592000">30 days</option>
      </select>

      <button id="create-btn">generate new invite</button>

      <div class="status" id="status"></div>
      <div class="link-box" id="link-box"></div>

      <h3>active invites</h3>
      <div class="token-list" id="token-list">
        <div class="empty">loading...</div>
      </div>

    </div>

    <a class="back" href="/">← back</a>

  </div>
</div>

<script>
  const loginSection = document.getElementById('login-section');
  const mainSection = document.getElementById('main-section');
  const passwordEl = document.getElementById('password');
  const loginBtn = document.getElementById('login-btn');
  const loginStatus = document.getElementById('login-status');
  const durationEl = document.getElementById('duration');
  const statusEl = document.getElementById('status');
  const linkBox = document.getElementById('link-box');
  const tokenList = document.getElementById('token-list');

  let secret = sessionStorage.getItem('invite_secret') || '';

  if (secret) {
    loginSection.classList.add('hidden');
    mainSection.classList.remove('hidden');
    loadTokens();
  }

  loginBtn.addEventListener('click', async () => {
    const pw = passwordEl.value.trim();
    if (!pw) return;

    loginBtn.disabled = true;
    loginStatus.textContent = 'checking...';
    loginStatus.className = 'status';

    try {
      const res = await fetch('/api/invite', {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });

      // Actually test with password via list
      const testRes = await fetch('/api/invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw, expiresIn: 1 }) // will create a 1s token just to test auth
      });

      // Better: just try listing
      const listRes = await fetch('/api/invite?password=' + encodeURIComponent(pw));
      const listData = await listRes.json();

      if (listRes.status === 401) {
        loginStatus.textContent = 'wrong password';
        loginStatus.className = 'status err';
      } else {
        secret = pw;
        sessionStorage.setItem('invite_secret', pw);
        loginSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        loadTokens();
      }
    } catch {
      loginStatus.textContent = 'network error';
      loginStatus.className = 'status err';
    }

    loginBtn.disabled = false;
  });

  function formatTTL(ttl) {
    if (ttl === -1) return 'permanent';
    if (ttl < 0) return 'expired';
    if (ttl < 60) return ttl + 's left';
    if (ttl < 3600) return Math.round(ttl / 60) + 'm left';
    if (ttl < 86400) return Math.round(ttl / 3600) + 'h left';
    return Math.round(ttl / 86400) + 'd left';
  }

  async function loadTokens() {
    tokenList.innerHTML = '<div class="empty">loading...</div>';

    try {
      const res = await fetch('/api/invite?password=' + encodeURIComponent(secret));
      const data = await res.json();

      if (!data.tokens || data.tokens.length === 0) {
        tokenList.innerHTML = '<div class="empty">no active invites</div>';
        return;
      }

      tokenList.innerHTML = '';
      for (const t of data.tokens) {
        const item = document.createElement('div');
        item.className = 'token-item';
        item.innerHTML = `
          <div class="token-id">${t.token}</div>
          <a class="token-link" href="${t.link}" target="_blank">${t.link}</a>
          <div class="token-meta">
            <span class="token-ttl">${formatTTL(t.ttl)}</span>
            <button class="danger" data-token="${t.token}">revoke</button>
          </div>
        `;
        tokenList.appendChild(item);
      }

      // Attach revoke handlers
      tokenList.querySelectorAll('button.danger').forEach(btn => {
        btn.addEventListener('click', async () => {
          const token = btn.dataset.token;
          btn.disabled = true;

          try {
            const res = await fetch('/api/invite', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: secret, token })
            });
            const data = await res.json();

            if (res.ok) {
              statusEl.textContent = 'revoked';
              statusEl.className = 'status ok';
              loadTokens();
            } else {
              statusEl.textContent = data.error || 'failed';
              statusEl.className = 'status err';
              btn.disabled = false;
            }
          } catch {
            statusEl.textContent = 'network error';
            statusEl.className = 'status err';
            btn.disabled = false;
          }
        });
      });
    } catch {
      tokenList.innerHTML = '<div class="empty">failed to load</div>';
    }
  }

  document.getElementById('create-btn').addEventListener('click', async () => {
    const btn = document.getElementById('create-btn');
    btn.disabled = true;
    statusEl.textContent = 'generating...';
    statusEl.className = 'status';
    linkBox.classList.remove('visible');

    const expiresIn = durationEl.value ? Number(durationEl.value) : null;

    try {
      const res = await fetch('/api/invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password: secret,
          ...(expiresIn ? { expiresIn } : {})
        })
      });

      const data = await res.json();

      if (res.ok) {
        statusEl.textContent = 'invite created ✓';
        statusEl.className = 'status ok';
        linkBox.textContent = data.link;
        linkBox.classList.add('visible');
        loadTokens();
      } else {
        statusEl.textContent = data.error || 'error';
        statusEl.className = 'status err';
      }
    } catch {
      statusEl.textContent = 'network error';
      statusEl.className = 'status err';
    }

    btn.disabled = false;
  });
</script>

</body>
</html>
