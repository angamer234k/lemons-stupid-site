<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>memory · lemon</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#0a0a0b;font-family:Inter,system-ui,sans-serif;user-select:none;color:#f5f5f5}
body{background-image:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(253,224,71,.1),transparent);padding-bottom:24px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.back{color:#a1a1aa;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 12px;border-radius:999px;border:1px solid #27272a;background:#111113}
.title{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fde047}
.meta{font-size:.8rem;font-weight:600;color:#a1a1aa}.meta span{color:#fde047}
.stage{display:flex;flex-direction:column;align-items:center;padding:16px;gap:16px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,360px)}
.card{aspect-ratio:1;border-radius:12px;background:#18181b;border:1px solid #27272a;display:flex;align-items:center;justify-content:center;
font-size:1.8rem;cursor:pointer;transition:transform .15s,background .15s}
.card.flipped,.card.matched{background:#111113;border-color:#fde047}
.card.matched{opacity:.7}
.btn{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #27272a;background:#18181b;color:#fde047;font-weight:600;font-family:inherit}
</style></head><body>
<header><a class="back" href="/games.html">← games</a><div class="title">memory</div><div class="meta">moves <span id="mv">0</span></div></header>
<div class="stage"><div class="board" id="b"></div><button class="btn" id="new">new game</button></div>
<script>
(function(){
const EMO=['🍋','🐍','🎮','💻','⚡','🔥','💜','✨'];
let cards,flipped,lock,moves,matched;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){const deck=shuffle([...EMO,...EMO]);cards=deck;flipped=[];lock=false;moves=0;matched=0;
document.getElementById('mv').textContent=0;const b=document.getElementById('b');b.innerHTML='';
deck.forEach((e,i)=>{const d=document.createElement('div');d.className='card';d.dataset.i=i;d.dataset.e=e;d.textContent='';
d.onclick=()=>flip(d);b.appendChild(d)})}
function flip(d){if(lock||d.classList.contains('flipped')||d.classList.contains('matched'))return;
d.classList.add('flipped');d.textContent=d.dataset.e;flipped.push(d);
if(flipped.length===2){moves++;document.getElementById('mv').textContent=moves;lock=true;
const[a,b]=flipped;if(a.dataset.e===b.dataset.e){a.classList.add('matched');b.classList.add('matched');matched+=2;flipped=[];lock=false;
if(matched===16)setTimeout(()=>alert('nice 🍋 moves: '+moves),200)}
else setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');a.textContent='';b.textContent='';flipped=[];lock=false},550)}}
document.getElementById('new').onclick=init;init()})();
</script></body></html>
