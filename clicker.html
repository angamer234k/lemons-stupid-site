<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>lemon farm · lemon</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#0a0a0b;font-family:Inter,system-ui,sans-serif;user-select:none;color:#f5f5f5}
body{background-image:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(253,224,71,.12),transparent);padding-bottom:32px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.back{color:#a1a1aa;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 12px;border-radius:999px;border:1px solid #27272a;background:#111113}
.title{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fde047}
.stage{max-width:400px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:20px}
.count{font-family:'Space Grotesk',sans-serif;font-size:2.4rem;color:#fde047;font-weight:700}
.rate{color:#71717a;font-size:.85rem;font-weight:600}
.lemon{width:140px;height:140px;border-radius:50%;background:#18181b;border:3px solid #fde047;display:flex;align-items:center;justify-content:center;
font-size:4rem;cursor:pointer;box-shadow:0 0 30px rgba(253,224,71,.25);transition:transform .08s}
.lemon:active{transform:scale(.92)}
.shop{width:100%;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#111113;border:1px solid #27272a;border-radius:14px}
.item button{min-height:40px;padding:0 14px;border-radius:999px;border:none;background:#fde047;color:#0a0a0b;font-weight:700;font-family:inherit;font-size:.85rem}
.item button:disabled{opacity:.4}
.item .info{font-size:.9rem;font-weight:600}.item .info small{display:block;color:#71717a;font-weight:500;font-size:.75rem;margin-top:2px}
</style></head><body>
<header><a class="back" href="/games.html">← games</a><div class="title">lemon farm</div><div style="width:70px"></div></header>
<div class="stage">
  <div class="count"><span id="n">0</span> 🍋</div>
  <div class="rate"><span id="r">0</span> / sec</div>
  <div class="lemon" id="tap">🍋</div>
  <div class="shop" id="shop"></div>
</div>
<script>
(function(){
const KEY='lemon-farm-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{n:0,click:1,items:{}};
const items=[
  {id:'cursor',name:'Auto cursor',base:15,rate:0.1},
  {id:'grove',name:'Lemon grove',base:100,rate:1},
  {id:'farm',name:'Farm',base:500,rate:5},
  {id:'factory',name:'Factory',base:3000,rate:20},
];
function cost(it){const owned=data.items[it.id]||0;return Math.floor(it.base*Math.pow(1.15,owned))}
function rate(){return items.reduce((s,it)=>s+(data.items[it.id]||0)*it.rate,0)}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
  document.getElementById('n').textContent=Math.floor(data.n);
  document.getElementById('r').textContent=rate().toFixed(1);
  const shop=document.getElementById('shop');shop.innerHTML='';
  items.forEach(it=>{
    const owned=data.items[it.id]||0,c=cost(it);
    const row=document.createElement('div');row.className='item';
    row.innerHTML='<div class="info">'+it.name+' <small>'+owned+' owned · +'+it.rate+'/s</small></div>';
    const btn=document.createElement('button');btn.textContent=c+' 🍋';btn.disabled=data.n<c;
    btn.onclick=()=>{if(data.n<c)return;data.n-=c;data.items[it.id]=(data.items[it.id]||0)+1;save();render()};
    row.appendChild(btn);shop.appendChild(row);
  });
}
document.getElementById('tap').addEventListener('pointerdown',()=>{data.n+=data.click;save();render()});
setInterval(()=>{const r=rate();if(r){data.n+=r/10;save();document.getElementById('n').textContent=Math.floor(data.n)}},100);
render()})();
</script></body></html>
