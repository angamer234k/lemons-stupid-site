<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild Countdown · Honeypot</title>

    <!-- JetBrains Mono – terminal/Code font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', monospace;
            background: #0a0e15;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 30% 40%, #141f30 0%, #0a0e15 75%);
            padding: 24px;
        }

        .countdown-wrapper {
            max-width: 900px;
            width: 100%;
            background: rgba(12, 18, 28, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 48px 40px 40px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            text-align: center;
        }

        /* ----- TOP BAR ----- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #6a7f9a;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .status-dot.online {
            background: #3ba55d;
            box-shadow: 0 0 20px rgba(59, 165, 93, 0.5);
        }
        .status-dot.connecting {
            background: #faa81a;
            box-shadow: 0 0 20px rgba(250, 168, 26, 0.5);
            animation: pulse-dot 1s infinite;
        }
        .status-dot.offline {
            background: #ed4245;
            box-shadow: 0 0 20px rgba(237, 66, 69, 0.3);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .status-label {
            font-weight: 400;
        }
        .status-label strong {
            color: #e8edf5;
            font-weight: 700;
        }

        .goal-display {
            font-size: 13px;
            color: #6a7f9a;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 18px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .goal-display span {
            color: #b8c8e0;
            font-weight: 700;
        }

        /* ----- MAIN COUNTDOWN NUMBER (RAINBOW) ----- */
        .count-number {
            font-size: clamp(80px, 18vw, 200px);
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
            padding: 20px 0 8px;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s;
            background: linear-gradient(145deg, #f0f4ff, #8aa8d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(88, 101, 242, 0.08);
        }

        /* Rainbow animation when goal reached */
        .count-number.rainbow {
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 2s linear infinite;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Sub info */
        .sub-info {
            font-size: 15px;
            color: #6a7f9a;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .sub-info strong {
            color: #b8c8e0;
            font-weight: 700;
        }

        /* Progress bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            margin: 24px 0 18px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5865f2, #3b48c0);
            border-radius: 8px;
            transition: width 0.5s ease;
            box-shadow: 0 0 24px rgba(88, 101, 242, 0.2);
        }
        .progress-fill.complete {
            background: linear-gradient(90deg, #3ba55d, #2d8b4a);
            box-shadow: 0 0 24px rgba(59, 165, 93, 0.3);
        }

        /* Connect button */
        .connect-btn {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #6a7f9a;
            padding: 6px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .connect-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e8edf5;
        }
        .connect-btn:active {
            transform: scale(0.96);
        }

        /* Explanation (terminal style) */
        .explanation {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            text-align: left;
            font-size: 13px;
            color: #4a5f7a;
            line-height: 1.7;
        }
        .explanation .prompt {
            color: #5865f2;
            font-weight: 700;
        }
        .explanation .cmd {
            color: #b8c8e0;
        }
        .explanation .highlight {
            color: #faa81a;
        }
        .explanation .goal-highlight {
            color: #8aa8d8;
            font-weight: 700;
        }
        .explanation .blink {
            animation: blink 1.2s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .countdown-wrapper { padding: 28px 20px 28px; }
            .top-bar { flex-direction: column; align-items: stretch; gap: 8px; }
            .goal-display { align-self: flex-start; }
            .count-number { font-size: clamp(60px, 25vw, 120px); }
            .sub-info { font-size: 13px; }
            .explanation { font-size: 12px; }
        }
        @media (max-width: 400px) {
            .countdown-wrapper { padding: 20px 14px 20px; }
            .count-number { font-size: 48px; }
            .status-badge { font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="countdown-wrapper">
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="status-badge">
                <span class="status-dot offline" id="statusDot"></span>
                <span class="status-label" id="statusLabel">
                    <strong id="statusText">Disconnected</strong>
                    <span id="statusDetail" style="color:#4a5f7a;font-weight:400;"></span>
                </span>
            </div>
            <div class="goal-display">
                🎯 Goal: <span id="goalDisplay">70,000</span> guilds
            </div>
        </div>

        <!-- COUNTDOWN -->
        <div class="count-number" id="countNumber">0</div>
        <div class="sub-info">
            <span id="remainingLabel">remaining</span>
            &nbsp;·&nbsp;
            current: <strong id="currentGuilds">0</strong>
        </div>

        <!-- PROGRESS -->
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- CONNECT BUTTON -->
        <button class="connect-btn" id="connectBtn">⟳ Connect</button>

        <!-- EXPLANATION -->
        <div class="explanation">
            <div><span class="prompt">$</span> <span class="cmd">guilds --countdown --goal 70000</span></div>
            <div style="margin-top:6px;">
                <span class="prompt">➜</span> Live countdown from
                <span class="highlight">honeypot-stats.riskymh.dev</span>
                &nbsp;·&nbsp; updates every <span class="highlight">~5s</span>
            </div>
            <div style="margin-top:4px; opacity:0.7;">
                <span class="prompt">◆</span> This page shows the remaining guilds until we hit
                <span class="goal-highlight" id="goalInExplanation">70,000</span>.
                <br />
                <span style="display:inline-block;margin-top:2px;">
                    <span class="prompt">▸</span> Auto‑reconnects if dropped &nbsp;·&nbsp; 🌈 celebration at goal!
                    <span class="blink">▍</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  CONFIG
        // ================================================================
        const WS_URL = 'wss://honeypot-stats.riskymh.dev/ws';
        const GOAL = 70000;   // 🎯 CHANGE THIS TO YOUR GOAL

        // ================================================================
        //  STATE
        // ================================================================
        let ws = null;
        let isConnected = false;
        let isConnecting = false;
        let reconnectAttempt = 0;
        let reconnectTimer = null;
        let manualDisconnect = false;
        let goalReached = false;

        let currentGuilds = 0;
        let remaining = GOAL;

        // DOM refs
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusDetail = document.getElementById('statusDetail');
        const connectBtn = document.getElementById('connectBtn');
        const countNumber = document.getElementById('countNumber');
        const remainingLabel = document.getElementById('remainingLabel');
        const currentGuildsEl = document.getElementById('currentGuilds');
        const progressFill = document.getElementById('progressFill');
        const goalDisplay = document.getElementById('goalDisplay');
        const goalInExplanation = document.getElementById('goalInExplanation');

        // Set goal display
        goalDisplay.textContent = GOAL.toLocaleString();
        goalInExplanation.textContent = GOAL.toLocaleString();

        // ================================================================
        //  STATUS HELPERS
        // ================================================================
        function setStatus(state, detail = '') {
            const dot = statusDot;
            const label = statusText;
            const detailEl = statusDetail;

            dot.className = 'status-dot';
            if (state === 'online') {
                dot.classList.add('online');
                label.textContent = 'Online';
                detailEl.textContent = detail || 'receiving';
            } else if (state === 'connecting') {
                dot.classList.add('connecting');
                label.textContent = 'Connecting…';
                detailEl.textContent = detail || `attempt ${reconnectAttempt + 1}`;
            } else {
                dot.classList.add('offline');
                label.textContent = 'Disconnected';
                detailEl.textContent = detail || 'waiting';
            }

            connectBtn.textContent = (state === 'online' || state === 'connecting') ? '● Disconnect' : '⟳ Connect';
            connectBtn.disabled = (state === 'connecting');
        }

        // ================================================================
        //  UPDATE UI
        // ================================================================
        function updateDisplay(guilds) {
            currentGuilds = guilds;
            remaining = GOAL - guilds;

            // If goal reached or exceeded, show 0 and celebrate
            if (remaining <= 0) {
                remaining = 0;
                if (!goalReached) {
                    goalReached = true;
                    countNumber.classList.add('rainbow');
                    remainingLabel.textContent = '0';
                }
            } else {
                goalReached = false;
                countNumber.classList.remove('rainbow');
                remainingLabel.textContent = 'remaining';
            }

            // Update number
            countNumber.textContent = remaining.toLocaleString();
            currentGuildsEl.textContent = guilds.toLocaleString();

            // Progress bar
            const progress = Math.min((guilds / GOAL) * 100, 100);
            progressFill.style.width = progress + '%';
            if (progress >= 100) {
                progressFill.classList.add('complete');
            } else {
                progressFill.classList.remove('complete');
            }
        }

        // ================================================================
        //  WEBSOCKET
        // ================================================================
        function connect() {
            if (isConnected || isConnecting) {
                disconnect();
                return;
            }
            manualDisconnect = false;
            reconnectAttempt = 0;
            doConnect();
        }

        function doConnect() {
            if (manualDisconnect || isConnected) return;
            isConnecting = true;
            setStatus('connecting', `attempt ${reconnectAttempt + 1}`);

            try {
                ws = new WebSocket(WS_URL);
                ws.onopen = onOpen;
                ws.onmessage = onMessage;
                ws.onclose = onClose;
                ws.onerror = onError;
            } catch (err) {
                console.error('WS error:', err);
                isConnecting = false;
                setStatus('offline', 'error');
                scheduleReconnect();
            }
        }

        function onOpen() {
            isConnected = true;
            isConnecting = false;
            reconnectAttempt = 0;
            setStatus('online', 'connected');
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        }

        function onMessage(e) {
            try {
                const data = JSON.parse(e.data);
                if (data.guilds !== undefined && typeof data.guilds === 'number') {
                    updateDisplay(data.guilds);
                    statusDetail.textContent = `last ${new Date().toLocaleTimeString()}`;
                }
            } catch (_) {
                // ignore non-JSON
            }
        }

        function onClose(event) {
            isConnected = false;
            isConnecting = false;
            setStatus('offline', event.reason || 'closed');
            if (ws) { ws = null; }
            if (!manualDisconnect) scheduleReconnect();
        }

        function onError(event) {
            // onclose follows
        }

        function disconnect() {
            manualDisconnect = true;
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            if (ws) { try { ws.close(1000, 'manual'); } catch (_) {} ws = null; }
            isConnected = false;
            isConnecting = false;
            setStatus('offline', 'disconnected');
        }

        function scheduleReconnect() {
            if (manualDisconnect || isConnected) return;
            const delay = [1000, 2000, 4000, 8000, 15000, 30000][Math.min(reconnectAttempt, 5)];
            reconnectAttempt++;
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            statusDetail.textContent = `reconnect in ${(delay/1000).toFixed(1)}s`;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                if (!manualDisconnect && !isConnected) doConnect();
            }, delay);
        }

        // ================================================================
        //  EVENT BINDING
        // ================================================================
        connectBtn.addEventListener('click', connect);

        // ================================================================
        //  INIT
        // ================================================================
        setStatus('offline', 'ready');
        updateDisplay(0);

        // Auto-connect after a moment
        setTimeout(() => connect(), 700);

        window.addEventListener('beforeunload', () => {
            if (ws) { try { ws.close(1000, 'unload'); } catch (_) {} }
            if (reconnectTimer) clearTimeout(reconnectTimer);
        });

        console.log(`🔷 Guild Countdown · goal: ${GOAL}`);
        console.log('📡', WS_URL);
    </script>

</body>
</html>
