<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>lemon's profile</title>

  <!-- Open Graph / Embed Metadata -->
  <meta property="og:title" content="lemon's profile" />
  <meta property="og:description" content="hiya! im lemon (@GJ4JHK on RBLX) — check out my hobbies and contact me!" />
  <meta property="og:image" content="avatar.png" />
  <meta property="og:url" content="" />
  <meta name="twitter:card" content="summary" />

  <!-- 🍋 LEMON FONT for peak citrus energy -->
  <link href="https://fonts.googleapis.com/css2?family=Lemon&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #1e1e2a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', 'Helvetica', sans-serif;
      padding: 20px;
    }

    .card-wrapper {
      width: 85vw;
      max-width: 700px;
      padding: 3px;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .card {
      width: 100%;
      background-color: #67809f;
      border-radius: 13px;
      padding: 32px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* 🍋 PEAK LEMON VIBE */
    .lemon-heading {
      font-family: 'Lemon', cursive, 'Comic Sans MS', sans-serif;
      font-weight: 400;
      font-size: 3.5rem;
      color: #fdff94;
      text-shadow:
        -2px -2px 0 #535353,
         2px -2px 0 #535353,
        -2px  2px 0 #535353,
         2px  2px 0 #535353;
      text-align: center;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #ffe77f;
      object-fit: cover;
      background: #2c3744;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(255, 231, 127, 0.35);
    }

    .bio-text {
      color: #ffffff;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      line-height: 1.4;
    }

    /* Live MSK clock */
    .clock-box {
      margin-top: 6px;
      background: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 160px;
    }

    .clock-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffe77f;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .clock-time {
      font-family: 'Courier New', monospace;
      font-size: 1.55rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
      tabular-nums: true;
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      width: 100%;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.05rem;
      text-align: center;
      letter-spacing: 0.5px;
      margin-top: 14px;
    }

    .row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chip {
      height: 28px;
      background-color: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 50px;
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 0 14px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .chip:hover {
      background-color: #3e4d5e;
      border-color: #6b8fc7;
      transform: translateY(-1px);
    }

    @media (max-width: 500px) {
      .lemon-heading { font-size: 2.6rem; }
      .chip { font-size: 13px; height: 26px; padding: 0 12px; }
      .bio-text { font-size: 1rem; }
      .section-title { font-size: 0.95rem; }
      .card { padding: 24px 16px 32px; gap: 14px; }
      .clock-time { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <div class="lemon-heading">lemon</div>

    <img
      class="avatar"
      src="avatar.png"
      alt="avatar"
    />

    <div class="bio-text">hiya! im lemon (@GJ4JHK on RBLX)</div>

    <!-- Live Moscow time -->
    <div class="clock-box">
      <div class="clock-label">MSK 👀</div>
      <div class="clock-time" id="msk-clock">--:--:--</div>
    </div>

    <div class="section-title">my hobbies are:</div>
    <div class="row">
      <span class="chip">gaming</span>
      <span class="chip">coding</span>
      <span class="chip">repeat</span>
    </div>

    <div class="section-title">contact me on</div>
    <div class="row">
      <a href="https://discord.gg/sSymHq6FjQ" class="chip" target="_blank" rel="noopener">DISCORD</a>
      <a href="https://github.com/angamer234k" class="chip" target="_blank" rel="noopener">GITHUB</a>
      <a href="https://emailthing.me/@lemon0real" class="chip" target="_blank" rel="noopener">CUSTOM</a>
    </div>

  </div>
</div>

<script>
  function updateMskClock() {
    const now = new Date();
    const time = now.toLocaleTimeString('en-GB', {
      timeZone: 'Europe/Moscow',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });
    document.getElementById('msk-clock').textContent = time;
  }

  updateMskClock();
  setInterval(updateMskClock, 1000);
</script>

</body>
</html>
