<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lemon 🍋</title>
  <meta property="og:title" content="lemon" />
  <meta property="og:description" content="hiya! im lemon — gaming, coding, repeat." />
  <meta property="og:image" content="avatar.png" />
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1a1a2e;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px),
        radial-gradient(circle at 10% 20%, rgba(255, 107, 107, 0.15), transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(254, 202, 87, 0.12), transparent 25%),
        radial-gradient(circle at 50% 50%, rgba(72, 219, 251, 0.08), transparent 40%);
      font-family: 'Space Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }
    .shell {
      width: 100%;
      max-width: 420px;
      position: relative;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.9) rotate(-2deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    .sticker {
      position: absolute;
      font-size: 1.6rem;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .s1 { top: -12px; left: -8px; transform: rotate(-15deg); }
    .s2 { top: -8px; right: 10px; transform: rotate(12deg); }
    .s3 { bottom: 40px; left: -18px; transform: rotate(8deg); font-size: 1.3rem; }
    .s4 { bottom: 20px; right: -12px; transform: rotate(-20deg); }
    .card {
      background: #16213e;
      border: 3px solid #0f3460;
      border-radius: 8px;
      padding: 28px 22px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow:
        6px 6px 0 #e94560,
        0 0 0 1px #533483;
      position: relative;
    }
    .name {
      font-family: 'Comic Neue', cursive;
      font-size: 2.8rem;
      font-weight: 700;
      color: #feca57;
      text-shadow: 3px 3px 0 #e94560;
      letter-spacing: 1px;
      transform: rotate(-2deg);
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      border: 3px solid #feca57;
      object-fit: cover;
      box-shadow: 4px 4px 0 #e94560;
      transition: transform 0.2s ease;
    }
    .avatar:hover { transform: rotate(-6deg) scale(1.08); }
    .bio {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: #eaeaea;
      line-height: 1.5;
    }
    .bio span {
      display: block;
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: 400;
      color: #a0a0b0;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f3460;
      border: 2px solid #533483;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #feca57;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #666;
    }
    .dot.on {
      background: #2ed573;
      box-shadow: 0 0 8px #2ed573;
      animation: blink 1.2s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0.4; }
    }
    .mood, .wall-preview {
      display: none;
      width: 100%;
      background: #0f3460;
      border: 2px dashed #533483;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: #ddd;
      line-height: 1.4;
    }
    .mood.show, .wall-preview.show { display: block; }
    .wall-preview .label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #e94560;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .wall-preview .msg { margin-bottom: 5px; }
    .wall-preview .msg:last-child { margin-bottom: 0; }
    .wall-preview .who { color: #feca57; font-weight: 700; }
    .wall-preview .txt { color: #bbb; }
    .wall-preview a {
      display: inline-block;
      margin-top: 6px;
      color: #48dbfb;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
    }
    .wall-preview a:hover { text-decoration: underline; color: #feca57; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    .chip {
      height: 32px;
      padding: 0 12px;
      border-radius: 4px;
      background: #0f3460;
      border: 2px solid #533483;
      color: #eaeaea;
      font-weight: 700;
      font-size: 0.75rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.12s ease;
      box-shadow: 2px 2px 0 #1a1a2e;
    }
    .chip:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 #e94560;
      border-color: #e94560;
      color: #feca57;
    }
    .chip.primary {
      background: #e94560;
      border-color: #c23152;
      color: #fff;
      box-shadow: 2px 2px 0 #1a1a2e;
    }
    .chip.primary:hover {
      background: #feca57;
      border-color: #f0b429;
      color: #1a1a2e;
      box-shadow: 4px 4px 0 #e94560;
    }
  </style>
</head>
<body>
<div class="shell">
  <span class="sticker s1">🍋</span>
  <span class="sticker s2">✨</span>
  <span class="sticker s3">🎮</span>
  <span class="sticker s4">💻</span>
  <div class="card">
    <div class="name">lemon</div>
    <img class="avatar" src="avatar.png" alt="avatar" />
    <div class="bio">
      hiya! im lemon
      <span>@GJ4JHK on roblox · gaming · coding · repeat</span>
    </div>
    <div class="meta">
      <div class="pill"><span class="dot" id="status-dot"></span><span id="status-text">…</span></div>
      <div class="pill">MSK <span id="msk-clock">--:--</span></div>
    </div>
    <div class="mood" id="mood"></div>
    <div class="wall-preview" id="wall-preview">
      <div class="label">// latest drops</div>
      <div id="wall-msgs"></div>
      <a href="/wall">→ open wall</a>
    </div>
    <div class="links">
      <a class="chip primary" href="/message">message</a>
      <a class="chip" href="/wall">wall</a>
      <a class="chip" href="/status">status</a>
      <a class="chip" href="/uptime">uptime</a>
      <a class="chip" href="https://discord.gg/sSymHq6FjQ" target="_blank" rel="noopener">discord</a>
      <a class="chip" href="https://github.com/angamer234k" target="_blank" rel="noopener">github</a>
      <a class="chip" href="https://emailthing.me/@lemon0real" target="_blank" rel="noopener">email</a>
    </div>
  </div>
</div>
<script>
function ago(ts){const d=Date.now()-ts,m=Math.floor(d/6e4),h=Math.floor(d/36e5),day=Math.floor(d/864e5);if(m<1)return'just now';if(m<60)return m+'m ago';if(h<24)return h+'h ago';return day+'d ago'}
function tickClock(){document.getElementById('msk-clock').textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',hour12:false})}
tickClock();setInterval(tickClock,15e3);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function refreshStatus(){const dot=document.getElementById('status-dot'),text=document.getElementById('status-text'),moodEl=document.getElementById('mood');try{const res=await fetch('/api/status',{cache:'no-store'});const data=await res.json();if(data.site&&data.site.online){dot.className='dot on';text.textContent='online'}else if(data.site&&data.site.lastOnline){dot.className='dot';text.textContent='last seen '+ago(data.site.lastOnline)}else{dot.className='dot';text.textContent='offline'}const mood=data.mood;if(mood&&(mood.text||'').trim()){moodEl.innerHTML=(mood.emoji||'🍋')+' '+esc(mood.text);moodEl.classList.add('show')}else{moodEl.classList.remove('show');moodEl.textContent=''}}catch{dot.className='dot';text.textContent='status unknown'}}
async function loadWallPreview(){const box=document.getElementById('wall-preview'),msgs=document.getElementById('wall-msgs');try{const res=await fetch('/api/wall?limit=2',{cache:'no-store'});const data=await res.json();if(!data.ok||!data.messages||!data.messages.length)return;msgs.innerHTML=data.messages.slice(0,2).map(m=>{const name=esc(m.name||'Anonymous');const text=esc((m.message||'').slice(0,80))+((m.message||'').length>80?'…':'');return`<div class="msg"><span class="who">${name}</span> <span class="txt">${text}</span></div>`}).join('');box.classList.add('show')}catch{}}
refreshStatus();loadWallPreview();setInterval(refreshStatus,3e4);
</script>
</body>
</html>
