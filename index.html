<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lemon</title>
  <meta property="og:title" content="lemon" />
  <meta property="og:description" content="hiya! im lemon — gaming, coding, repeat." />
  <meta property="og:image" content="avatar.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f5f0e8;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(253, 186, 116, 0.25), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(167, 243, 208, 0.2), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(254, 240, 138, 0.15), transparent 50%);
      font-family: 'Nunito', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .shell {
      width: 100%;
      max-width: 400px;
      animation: floatIn 0.5s ease-out;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card {
      background: #fffaf3;
      border-radius: 28px;
      padding: 36px 28px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow:
        0 4px 0 #e8d9c4,
        0 20px 40px -10px rgba(180, 140, 90, 0.2);
      border: 2px solid #f0e6d6;
    }
    .name {
      font-size: 2.5rem;
      font-weight: 800;
      color: #d97706;
      letter-spacing: -0.02em;
    }
    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 4px solid #fde68a;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.15);
      transition: transform 0.3s ease;
    }
    .avatar:hover { transform: scale(1.06) rotate(4deg); }
    .bio {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: #44403c;
      line-height: 1.5;
    }
    .bio span {
      display: block;
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a8a29e;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef3c7;
      border: 2px solid #fde68a;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #92400e;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d6d3d1;
    }
    .dot.on {
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.25);
    }
    .mood, .wall-preview {
      display: none;
      width: 100%;
      background: #fef9ef;
      border: 2px solid #f0e6d6;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 0.9rem;
      color: #57534e;
      line-height: 1.45;
      font-weight: 600;
    }
    .mood.show, .wall-preview.show { display: block; }
    .wall-preview .label {
      font-size: 0.7rem;
      font-weight: 800;
      color: #a8a29e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .wall-preview .msg { margin-bottom: 6px; }
    .wall-preview .msg:last-child { margin-bottom: 0; }
    .wall-preview .who { color: #d97706; }
    .wall-preview .txt { color: #78716c; }
    .wall-preview a {
      display: inline-block;
      margin-top: 8px;
      color: #d97706;
      font-size: 0.8rem;
      font-weight: 800;
      text-decoration: none;
    }
    .wall-preview a:hover { text-decoration: underline; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    .chip {
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      background: #fef3c7;
      border: 2px solid #fde68a;
      color: #92400e;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.15s ease;
    }
    .chip:hover {
      background: #fde68a;
      transform: translateY(-2px);
      box-shadow: 0 4px 0 #f0c96a;
    }
    .chip.primary {
      background: #fbbf24;
      border-color: #f59e0b;
      color: #78350f;
    }
    .chip.primary:hover {
      background: #f59e0b;
      box-shadow: 0 4px 0 #d97706;
    }
  </style>
</head>
<body>
<div class="shell">
  <div class="card">
    <div class="name">lemon</div>
    <img class="avatar" src="avatar.png" alt="avatar" />
    <div class="bio">
      hiya! im lemon
      <span>@GJ4JHK on roblox · gaming · coding · repeat</span>
    </div>
    <div class="meta">
      <div class="pill"><span class="dot" id="status-dot"></span><span id="status-text">…</span></div>
      <div class="pill">MSK <span id="msk-clock">--:--</span></div>
    </div>
    <div class="mood" id="mood"></div>
    <div class="wall-preview" id="wall-preview">
      <div class="label">latest on the wall</div>
      <div id="wall-msgs"></div>
      <a href="/wall">see all →</a>
    </div>
    <div class="links">
      <a class="chip primary" href="/message">message</a>
      <a class="chip" href="/wall">wall</a>
      <a class="chip" href="/status">status</a>
      <a class="chip" href="/uptime">uptime</a>
      <a class="chip" href="https://discord.gg/sSymHq6FjQ" target="_blank" rel="noopener">discord</a>
      <a class="chip" href="https://github.com/angamer234k" target="_blank" rel="noopener">github</a>
      <a class="chip" href="https://emailthing.me/@lemon0real" target="_blank" rel="noopener">email</a>
    </div>
  </div>
</div>
<script>
function ago(ts){const d=Date.now()-ts,m=Math.floor(d/6e4),h=Math.floor(d/36e5),day=Math.floor(d/864e5);if(m<1)return'just now';if(m<60)return m+'m ago';if(h<24)return h+'h ago';return day+'d ago'}
function tickClock(){document.getElementById('msk-clock').textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',hour12:false})}
tickClock();setInterval(tickClock,15e3);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function refreshStatus(){const dot=document.getElementById('status-dot'),text=document.getElementById('status-text'),moodEl=document.getElementById('mood');try{const res=await fetch('/api/status',{cache:'no-store'});const data=await res.json();if(data.site&&data.site.online){dot.className='dot on';text.textContent='online'}else if(data.site&&data.site.lastOnline){dot.className='dot';text.textContent='last seen '+ago(data.site.lastOnline)}else{dot.className='dot';text.textContent='offline'}const mood=data.mood;if(mood&&(mood.text||'').trim()){moodEl.innerHTML=(mood.emoji||'🍋')+' '+esc(mood.text);moodEl.classList.add('show')}else{moodEl.classList.remove('show');moodEl.textContent=''}}catch{dot.className='dot';text.textContent='status unknown'}}
async function loadWallPreview(){const box=document.getElementById('wall-preview'),msgs=document.getElementById('wall-msgs');try{const res=await fetch('/api/wall?limit=2',{cache:'no-store'});const data=await res.json();if(!data.ok||!data.messages||!data.messages.length)return;msgs.innerHTML=data.messages.slice(0,2).map(m=>{const name=esc(m.name||'Anonymous');const text=esc((m.message||'').slice(0,80))+((m.message||'').length>80?'…':'');return`<div class="msg"><span class="who">${name}</span> <span class="txt">${text}</span></div>`}).join('');box.classList.add('show')}catch{}}
refreshStatus();loadWallPreview();setInterval(refreshStatus,3e4);
</script>
</body>
</html>
