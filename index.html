<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lemon's Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #1e1e2a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', 'Helvetica', sans-serif;
      padding: 20px;
    }

    .card-wrapper {
      width: 85vw;
      max-width: 700px;
      padding: 3px;
      border-radius: 16px;              /* rectangular */
      background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .card {
      width: 100%;
      background-color: #67809f;
      border-radius: 13px;
      padding: 24px 24px 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lemon-heading {
      margin-top: 40px;
      font-family: 'Arial Black', 'BuilderSansBold', sans-serif;
      font-weight: bold;
      font-size: 3.5rem;
      color: #fdff94;
      text-shadow: -2px -2px 0 #535353,
                    2px -2px 0 #535353,
                   -2px  2px 0 #535353,
                    2px  2px 0 #535353;
      text-align: center;
    }

    .avatar {
      margin-top: 4px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid #ffe77f;
      object-fit: cover;
      background: #2c3744;
      flex-shrink: 0;
    }

    .bio-text {
      margin-top: 80px;
      width: 100%;
      color: #ffffff;
      font-weight: bold;
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-size: 1.2rem;
      text-align: center;
    }

    .section-title {
      width: 100%;
      color: #ffffff;
      font-weight: bold;
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-size: 1.05rem;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .section-title.hobbies {
      margin-top: 100px;
    }
    .section-title.contact {
      margin-top: 150px;
    }

    .row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      height: 30px;
    }
    .row.hobbies {
      margin-top: 110px;
    }
    .row.contact {
      margin-top: 160px;
    }

    .chip {
      flex: 0 0 auto;
      height: 26px;
      aspect-ratio: 2.5 / 1;
      background-color: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 50px;
      color: #ffffff;
      font-weight: bold;
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 0 10px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .row.contact .chip:hover {
      background-color: #3e4d5e;
      border-color: #6b8fc7;
    }

    @media (max-width: 500px) {
      .lemon-heading { font-size: 2.6rem; }
      .chip { font-size: 14px; height: 22px; padding: 0 8px; }
      .bio-text { font-size: 1rem; }
      .section-title { font-size: 0.9rem; }
      .card { padding: 16px 12px 24px 12px; }
    }
  </style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <div class="lemon-heading">lemon</div>

    <!-- 
      🔥 Avatar now uses DiceBear – always works, no broken images.
      If you want your Roblox avatar, you can replace the src with:
      https://www.roblox.com/Thumbs/Avatar.ashx?x=64&y=64&userid=2545613154
      (but that sometimes doesn't load – DiceBear is the safe fallback)
    -->
    <img 
      class="avatar" 
      src="avatar.png" 
      alt="avatar" 
    />

    <div class="bio-text">hiya! im lemon (@GJ4JHK on RBLX)</div>

    <div class="section-title hobbies">my hobbies are:</div>
    <div class="row hobbies">
      <span class="chip">gaming</span>
      <span class="chip">coding</span>
      <span class="chip">repeat</span>
    </div>

    <div class="section-title contact">contact me on</div>
    <div class="row contact">
      <a href="https://discord.gg/sSymHq6FjQ" class="chip" target="_blank">DISCORD</a>
      <a href="https://github.com/angamer234k" class="chip" target="_blank">GITHUB</a>
      <a href="https://emailthing.me/@lemon0real" class="chip" target="_blank">CUSTOM</a>
    </div>

  </div>
</div>

</body>
</html>
