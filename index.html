<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lemon</title>
  <meta property="og:title" content="lemon" />
  <meta property="og:description" content="hiya! im lemon — gaming, coding, repeat." />
  <meta property="og:image" content="avatar.png" />
  <meta name="twitter:card" content="summary" />
  <link href="https://fonts.googleapis.com/css2?family=Lemon&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1e1e2a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px 16px;
    }
    .card-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 3px;
      border-radius: 16px;
      background: linear-gradient(180deg, #fff 0%, #888 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.5s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: #67809f;
      border-radius: 13px;
      padding: 28px 22px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .lemon-heading {
      font-family: 'Lemon', cursive, 'Comic Sans MS', sans-serif;
      font-size: 2.8rem;
      color: #fdff94;
      text-shadow:
        -2px -2px 0 #535353,
         2px -2px 0 #535353,
        -2px  2px 0 #535353,
         2px  2px 0 #535353;
      letter-spacing: 1px;
      line-height: 1.1;
      transition: transform 0.2s ease, filter 0.2s ease;
      cursor: default;
    }
    .lemon-heading:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 0 8px rgba(253, 255, 148, 0.45));
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 3px solid #ffe77f;
      object-fit: cover;
      background: #2c3744;
      box-shadow: 0 0 14px rgba(255, 231, 127, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .avatar:hover {
      transform: scale(1.06) rotate(-3deg);
      box-shadow: 0 0 20px rgba(255, 231, 127, 0.55);
    }
    .bio {
      color: #fff;
      font-weight: bold;
      font-size: 1.05rem;
      text-align: center;
      line-height: 1.45;
    }
    .bio .muted {
      display: block;
      margin-top: 4px;
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: bold;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #fff;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      flex-shrink: 0;
    }
    .dot.on {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px #4ade80; }
      50% { box-shadow: 0 0 12px #4ade80; }
    }
    .mood {
      display: none;
      width: 100%;
      text-align: center;
      background: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: bold;
      color: #fff;
      line-height: 1.35;
      font-size: 0.9rem;
    }
    .mood.show { display: block; }
    .mood .em { margin-right: 4px; }

    /* wall preview */
    .wall-preview {
      display: none;
      width: 100%;
      background: #2c3744;
      border: 2px solid #4b6ca5;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #e2e8f0;
      line-height: 1.4;
    }
    .wall-preview.show { display: block; }
    .wall-preview .label {
      font-size: 0.7rem;
      font-weight: bold;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .wall-preview .msg {
      margin-bottom: 6px;
    }
    .wall-preview .msg:last-child { margin-bottom: 0; }
    .wall-preview .who {
      color: #fdff94;
      font-weight: bold;
    }
    .wall-preview .txt {
      color: #cbd5e1;
    }
    .wall-preview a {
      color: #93c5fd;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.75rem;
    }
    .wall-preview a:hover { text-decoration: underline; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }
    .chip {
      height: 30px;
      padding: 0 14px;
      border-radius: 999px;
      background: #2c3744;
      border: 2px solid #4b6ca5;
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .chip:hover {
      background: #3e4d5e;
      border-color: #6b8fc7;
      transform: translateY(-2px);
    }
    .chip.primary {
      border-color: #fdff94;
      color: #fdff94;
    }
    .chip.primary:hover {
      background: #3e4d5e;
      border-color: #fdff94;
      box-shadow: 0 0 10px rgba(253, 255, 148, 0.25);
    }
    @media (max-width: 400px) {
      .lemon-heading { font-size: 2.3rem; }
      .card { padding: 22px 16px 22px; }
    }
  </style>
</head>
<body>
<div class="card-wrapper"><div class="card">
  <div class="lemon-heading">lemon</div>
  <img class="avatar" src="avatar.png" alt="avatar" />
  <div class="bio">
    hiya! im lemon
    <span class="muted">@GJ4JHK on roblox · gaming · coding · repeat</span>
  </div>

  <div class="meta">
    <div class="pill" id="status-pill">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">…</span>
    </div>
    <div class="pill" id="clock-pill" title="Moscow time">MSK <span id="msk-clock">--:--</span></div>
  </div>

  <div class="mood" id="mood"></div>

  <div class="wall-preview" id="wall-preview">
    <div class="label">latest on the wall</div>
    <div id="wall-msgs"></div>
    <div style="margin-top:8px"><a href="/wall">see all →</a></div>
  </div>

  <div class="links">
    <a class="chip primary" href="/message">message</a>
    <a class="chip" href="/wall">wall</a>
    <a class="chip" href="/status">status</a>
    <a class="chip" href="/uptime">uptime</a>
    <a class="chip" href="https://discord.gg/sSymHq6FjQ" target="_blank" rel="noopener">discord</a>
    <a class="chip" href="https://github.com/angamer234k" target="_blank" rel="noopener">github</a>
    <a class="chip" href="https://emailthing.me/@lemon0real" target="_blank" rel="noopener">email</a>
  </div>
</div></div>
<script>
function ago(ts) {
  const d = Date.now() - ts;
  const m = Math.floor(d / 60000);
  const h = Math.floor(d / 3600000);
  const day = Math.floor(d / 86400000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (h < 24) return h + 'h ago';
  return day + 'd ago';
}

function tickClock() {
  const t = new Date().toLocaleTimeString('en-GB', {
    timeZone: 'Europe/Moscow',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false,
  });
  document.getElementById('msk-clock').textContent = t;
}
tickClock();
setInterval(tickClock, 15000);

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

async function refreshStatus() {
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  const moodEl = document.getElementById('mood');
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    const data = await res.json();

    if (data.site && data.site.online) {
      dot.className = 'dot on';
      text.textContent = 'online';
    } else if (data.site && data.site.lastOnline) {
      dot.className = 'dot';
      text.textContent = 'last seen ' + ago(data.site.lastOnline);
    } else {
      dot.className = 'dot';
      text.textContent = 'offline';
    }

    const mood = data.mood;
    if (mood && (mood.text || '').trim()) {
      moodEl.innerHTML =
        '<span class="em">' + (mood.emoji || '🍋') + '</span> ' + esc(mood.text);
      moodEl.classList.add('show');
    } else {
      moodEl.classList.remove('show');
      moodEl.textContent = '';
    }
  } catch {
    dot.className = 'dot';
    text.textContent = 'status unknown';
  }
}

async function loadWallPreview() {
  const box = document.getElementById('wall-preview');
  const msgs = document.getElementById('wall-msgs');
  try {
    const res = await fetch('/api/wall?limit=2', { cache: 'no-store' });
    const data = await res.json();
    if (!data.ok || !data.messages || !data.messages.length) return;

    msgs.innerHTML = data.messages.slice(0, 2).map(m => {
      const name = esc(m.name || 'Anonymous');
      const text = esc((m.message || '').slice(0, 80)) + ((m.message || '').length > 80 ? '…' : '');
      return `<div class="msg"><span class="who">${name}</span> <span class="txt">${text}</span></div>`;
    }).join('');
    box.classList.add('show');
  } catch {
    // silent fail – preview is optional
  }
}

refreshStatus();
loadWallPreview();
setInterval(refreshStatus, 30000);
</script>
</body>
</html>
