<!DOCTYPE html>
<html>
<head>
    <title>Pixel Art for Discord</title>
    <style>
        body { font-family: Arial; background: #2c2f33; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .container { background: #23272a; padding: 25px; border-radius: 12px; max-width: 550px; }
        .grid { display: grid; gap: 4px; margin: 20px 0; }
        .pixel { aspect-ratio: 1; border: 2px solid #555; cursor: pointer; background: #1e1e1e; border-radius: 4px; }
        .pixel:hover { border-color: #fff; }
        .colors { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #555; cursor: pointer; transition: 0.2s; }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: #fff; box-shadow: 0 0 12px #fff; }
        .output-area { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        textarea { width: 100%; height: 120px; background: #1e1e1e; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; font-family: monospace; resize: vertical; }
        .btn { background: #5865f2; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #4752c4; }
        .clear-btn { background: #ed4245; margin-left: 10px; }
        .clear-btn:hover { background: #c03537; }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .label { font-size: 14px; color: #b9bbbe; margin-bottom: 5px; }
        .note { font-size: 12px; color: #b9bbbe; margin-top: 10px; background: #1e1e1e; padding: 8px; border-radius: 4px; }
        select { background: #1e1e1e; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .size-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎨 Pixel Art for Discord</h2>
    <div class="size-selector">
        <span class="label">Grid size:</span>
        <select id="sizeSelect">
            <option value="4">4×4</option>
            <option value="6" selected>6×6</option>
            <option value="8">8×8</option>
            <option value="10">10×10</option>
        </select>
    </div>
    <div class="label">1. Pick a color</div>
    <div class="colors" id="colorPalette"></div>
    <div class="label">2. Click pixels to paint</div>
    <div class="grid" id="gridContainer"></div>
    <div class="flex-row">
        <button class="btn" id="generateBtn">⬇ Generate Discord Text</button>
        <button class="btn clear-btn" id="clearBtn">🗑 Clear</button>
    </div>
    <div class="output-area">
        <div class="label">Copy this into Discord inside a code block:</div>
        <textarea id="outputText" readonly></textarea>
        <button class="btn" id="copyBtn">📋 Copy to Clipboard</button>
    </div>
    <div class="note">⚠️ Works only on Discord Desktop. Uses <code>\u001b</code> escape sequences.</div>
</div>
<script>
    const COLORS = [
        { name: 'Black', bg: 40, hex: '#1e1e1e' },
        { name: 'Red', bg: 41, hex: '#e74c3c' },
        { name: 'Green', bg: 42, hex: '#2ecc71' },
        { name: 'Yellow', bg: 43, hex: '#f1c40f' },
        { name: 'Blue', bg: 44, hex: '#3498db' },
        { name: 'Pink', bg: 45, hex: '#e67e22' },
        { name: 'Cyan', bg: 46, hex: '#1abc9c' },
        { name: 'White', bg: 47, hex: '#ecf0f1' },
        { name: 'Gray', bg: 100, hex: '#95a5a6' },
        { name: 'Bright Red', bg: 101, hex: '#ff6b6b' },
        { name: 'Bright Green', bg: 102, hex: '#55efc4' },
        { name: 'Bright Yellow', bg: 103, hex: '#fdcb6e' },
        { name: 'Bright Blue', bg: 104, hex: '#74b9ff' },
        { name: 'Bright Pink', bg: 105, hex: '#fd79a8' },
        { name: 'Bright Cyan', bg: 106, hex: '#81ecec' },
        { name: 'Bright White', bg: 107, hex: '#dfe6e9' },
    ];

    let size = 6;
    let grid = [];
    let selectedColor = 0;

    function initGrid() {
        grid = Array(size).fill().map(() => Array(size).fill(0));
    }

    function renderGrid() {
        const container = document.getElementById('gridContainer');
        container.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        container.innerHTML = '';
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const div = document.createElement('div');
                div.className = 'pixel';
                div.style.background = COLORS[grid[r][c]]?.hex || '#1e1e1e';
                div.dataset.row = r;
                div.dataset.col = c;
                div.addEventListener('click', () => {
                    grid[r][c] = selectedColor;
                    renderGrid();
                });
                container.appendChild(div);
            }
        }
    }

    function renderPalette() {
        const palette = document.getElementById('colorPalette');
        palette.innerHTML = '';
        COLORS.forEach((color, index) => {
            const btn = document.createElement('div');
            btn.className = 'color-btn' + (index === selectedColor ? ' active' : '');
            btn.style.background = color.hex;
            btn.title = color.name;
            btn.addEventListener('click', () => {
                selectedColor = index;
                renderPalette();
            });
            palette.appendChild(btn);
        });
    }

    function generateAnsi() {
        let lines = [];
        for (let r = 0; r < size; r++) {
            let rowPixels = [];
            for (let c = 0; c < size; c++) {
                const bgCode = COLORS[grid[r][c]].bg;
                rowPixels.push(`\u001b[${bgCode}m \u001b[0m`);
            }
            lines.push(rowPixels.join(''));
        }
        return lines.join('\n');
    }

    document.getElementById('generateBtn').addEventListener('click', () => {
        const ansi = generateAnsi();
        document.getElementById('outputText').value = '```ansi\n' + ansi + '\n```';
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const text = document.getElementById('outputText');
        text.select();
        document.execCommand('copy');
        alert('Copied! Paste it into Discord (desktop).');
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        initGrid();
        renderGrid();
        document.getElementById('outputText').value = '';
    });

    document.getElementById('sizeSelect').addEventListener('change', (e) => {
        size = parseInt(e.target.value);
        initGrid();
        renderGrid();
        document.getElementById('outputText').value = '';
    });

    // Initial setup
    initGrid();
    renderPalette();
    renderGrid();
</script>
</body>
</html>
