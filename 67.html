<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Certificate Generator</title>
    <!-- html2canvas for JPG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        /* ── main card ── */
        .app {
            max-width: 820px;
            width: 100%;
            background: #16213e;
            border-radius: 32px;
            padding: 30px 24px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .app h1 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: #c9a84c;
            margin-bottom: 6px;
        }

        .app .sub {
            font-size: 0.85rem;
            color: #8892b0;
            margin-bottom: 22px;
        }

        .app .sub span {
            color: #e6d5a8;
            font-weight: 500;
        }

        /* ── certificate preview ── */
        .certificate-wrapper {
            background: #0f1a2b;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 26px;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        #certificate {
            width: 100%;
            aspect-ratio: 1.414 / 1;
            /* ≈ A4 portrait */
            background: #fcf8f0;
            border-radius: 14px;
            padding: 28px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #1a1a2e;
            overflow: hidden;
            /* keep everything inside */
        }

        /* decorative border – pure CSS */
        #certificate::before {
            content: '';
            position: absolute;
            inset: 12px;
            border: 3px solid #c9a84c;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px #e8d5a8, 0 0 0 1px #e8d5a8;
        }

        /* corner decorations */
        #certificate .corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #c9a84c;
            border-style: solid;
            border-width: 0;
            pointer-events: none;
        }
        #certificate .corner.tl {
            top: 18px;
            left: 18px;
            border-top-width: 4px;
            border-left-width: 4px;
        }
        #certificate .corner.tr {
            top: 18px;
            right: 18px;
            border-top-width: 4px;
            border-right-width: 4px;
        }
        #certificate .corner.bl {
            bottom: 18px;
            left: 18px;
            border-bottom-width: 4px;
            border-left-width: 4px;
        }
        #certificate .corner.br {
            bottom: 18px;
            right: 18px;
            border-bottom-width: 4px;
            border-right-width: 4px;
        }

        /* inner content */
        .cert-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 0;
        }

        /* seal / crest */
        .seal {
            font-size: 2.4rem;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 6px rgba(201, 168, 76, 0.3));
            letter-spacing: 2px;
        }

        .cert-title {
            font-size: clamp(1.2rem, 4.5vw, 2.6rem);
            font-weight: 700;
            color: #1a2a6c;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Georgia', 'Times New Roman', serif;
            border-bottom: 2px solid #c9a84c;
            padding-bottom: 4px;
            margin-bottom: 4px;
            display: inline-block;
        }

        .cert-sub {
            font-size: clamp(0.6rem, 1.8vw, 1rem);
            color: #5a5a7a;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: 2px;
            font-family: 'Segoe UI', sans-serif;
        }

        .cert-name {
            font-size: clamp(1.8rem, 7vw, 4.2rem);
            font-weight: 700;
            color: #1a1a2e;
            margin: 2px 0 0px;
            font-family: 'Georgia', 'Times New Roman', serif;
            letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(201, 168, 76, 0.15);
            word-break: break-word;
            max-width: 100%;
        }

        .cert-from {
            font-size: clamp(0.7rem, 2vw, 1.1rem);
            color: #3a3a5a;
            margin-top: 2px;
        }
        .cert-from strong {
            color: #1a2a6c;
            font-weight: 600;
        }

        .cert-reason {
            font-size: clamp(0.75rem, 2vw, 1.15rem);
            color: #2a2a4a;
            font-style: italic;
            margin-top: 4px;
            padding: 0 10px;
            max-width: 90%;
            line-height: 1.4;
        }

        .cert-reason::before {
            content: '“';
            color: #c9a84c;
            font-size: 1.2em;
            font-weight: 700;
        }
        .cert-reason::after {
            content: '”';
            color: #c9a84c;
            font-size: 1.2em;
            font-weight: 700;
        }

        .cert-date {
            font-size: clamp(0.6rem, 1.6vw, 0.9rem);
            color: #6a6a8a;
            margin-top: 6px;
            letter-spacing: 2px;
            font-family: 'Segoe UI', sans-serif;
            border-top: 1px solid #ddd;
            padding-top: 6px;
            width: 60%;
        }

        /* ── buttons ── */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            color: #fff;
            background: #2a3a6a;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-svg {
            background: #1a3a5a;
        }
        .btn-svg:hover {
            background: #1e4a7a;
        }

        .btn-jpg {
            background: #8a6a2a;
        }
        .btn-jpg:hover {
            background: #a87e30;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn .badge {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 40px;
            padding: 0 10px;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* ── params info ── */
        .params-info {
            margin-top: 18px;
            font-size: 0.75rem;
            color: #5a6a8a;
            background: #0f1a2b;
            padding: 12px 16px;
            border-radius: 14px;
            word-break: break-all;
            line-height: 1.6;
            text-align: left;
        }
        .params-info code {
            background: #1a2a4a;
            padding: 2px 10px;
            border-radius: 6px;
            color: #c9a84c;
            font-size: 0.75rem;
        }
        .params-info a {
            color: #c9a84c;
            text-decoration: none;
        }
        .params-info a:hover {
            text-decoration: underline;
        }

        /* ── toast ── */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a2a4a;
            color: #e6d5a8;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
            border: 1px solid #c9a84c44;
            backdrop-filter: blur(6px);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .app {
                padding: 18px 14px 24px;
                border-radius: 24px;
            }
            #certificate {
                padding: 16px 14px;
            }
            #certificate::before {
                inset: 8px;
            }
            #certificate .corner {
                width: 20px;
                height: 20px;
            }
            #certificate .corner.tl,
            #certificate .corner.tr {
                top: 12px;
            }
            #certificate .corner.bl,
            #certificate .corner.br {
                bottom: 12px;
            }
            #certificate .corner.tl,
            #certificate .corner.bl {
                left: 12px;
            }
            #certificate .corner.tr,
            #certificate .corner.br {
                right: 12px;
            }
            .seal {
                font-size: 1.8rem;
            }
            .btn {
                padding: 10px 18px;
                font-size: 0.8rem;
                flex: 1 1 auto;
                min-width: 110px;
                justify-content: center;
            }
            .actions {
                gap: 8px;
            }
        }

        @media (max-width: 380px) {
            .cert-title {
                font-size: 1rem;
            }
            .cert-name {
                font-size: 1.4rem;
            }
            .seal {
                font-size: 1.4rem;
            }
            #certificate {
                padding: 10px 8px;
            }
            .btn {
                font-size: 0.7rem;
                padding: 8px 14px;
                min-width: 80px;
            }
        }

        /* loading shimmer for certificate */
        #certificate.loading .cert-content>* {
            opacity: 0.4;
        }
        #certificate.loading .cert-content::after {
            content: '⏳';
            position: absolute;
            font-size: 2rem;
            color: #c9a84c;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* scrollable params on small screens */
        .params-info {
            max-height: 80px;
            overflow-y: auto;
        }
        .params-info::-webkit-scrollbar {
            width: 4px;
        }
        .params-info::-webkit-scrollbar-track {
            background: #0f1a2b;
        }
        .params-info::-webkit-scrollbar-thumb {
            background: #c9a84c66;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app">
        <h1>📜 Certificate Generator</h1>
        <p class="sub">
            <span>?name=</span>Your Name&nbsp; <span>&from=</span>Giver&nbsp; <span>&reason=</span>Achievement
        </p>

        <div class="certificate-wrapper">
            <div id="certificate">
                <!-- corners -->
                <span class="corner tl"></span>
                <span class="corner tr"></span>
                <span class="corner bl"></span>
                <span class="corner br"></span>

                <div class="cert-content" id="certContent">
                    <div class="seal">🏅</div>
                    <div class="cert-title">Certificate of Achievement</div>
                    <div class="cert-sub">presented to</div>
                    <div class="cert-name" id="displayName">—</div>
                    <div class="cert-from" id="displayFrom"></div>
                    <div class="cert-reason" id="displayReason"></div>
                    <div class="cert-date" id="displayDate"></div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-svg" id="downloadSvgBtn">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/><path d="M12 15l-4-4h2.5V8h3v3H16l-4 4z"/><path d="M8 17h8v1.5H8V17z"/></svg>
                Download SVG
                <span class="badge">vector</span>
            </button>
            <button class="btn btn-jpg" id="downloadJpgBtn">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/><path d="M12 15l-4-4h2.5V8h3v3H16l-4 4z"/><path d="M8 17h8v1.5H8V17z"/></svg>
                Download JPG
                <span class="badge">image</span>
            </button>
        </div>

        <div class="params-info" id="paramsInfo">
            <strong>📌 Query params:</strong><br />
            <code>?name=</code><span id="infoName">—</span>
            <code>&from=</code><span id="infoFrom">—</span>
            <code>&reason=</code><span id="infoReason">—</span>
            <br />
            <span style="color:#6a8aaa;">🔗 Try:</span>
            <a href="?name=Alice%20Wonder&from=The%20Jury&reason=extraordinary%20curiosity" target="_blank">example</a>
            &nbsp;·&nbsp;
            <a href="?name=Marie%20Curie&from=Academy&reason=pioneering%20research" target="_blank">nobel</a>
        </div>
    </div>

    <div id="toast">✅ Downloaded!</div>

    <script>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
               CORE LOGIC
               ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

        (function() {
            'use strict';

            // ── DOM refs ──
            const certEl = document.getElementById('certificate');
            const contentEl = document.getElementById('certContent');
            const nameEl = document.getElementById('displayName');
            const fromEl = document.getElementById('displayFrom');
            const reasonEl = document.getElementById('displayReason');
            const dateEl = document.getElementById('displayDate');

            const infoName = document.getElementById('infoName');
            const infoFrom = document.getElementById('infoFrom');
            const infoReason = document.getElementById('infoReason');

            const downloadSvgBtn = document.getElementById('downloadSvgBtn');
            const downloadJpgBtn = document.getElementById('downloadJpgBtn');
            const toastEl = document.getElementById('toast');

            // ── helpers ──
            function getParam(key, fallback) {
                const url = new URL(window.location);
                const val = url.searchParams.get(key);
                return val !== null && val.trim() !== '' ? val.trim() : fallback;
            }

            function formatDate() {
                const d = new Date();
                const opts = { year: 'numeric', month: 'long', day: 'numeric' };
                return d.toLocaleDateString('en-US', opts);
            }

            function showToast(msg) {
                toastEl.textContent = msg || '✅ Downloaded!';
                toastEl.classList.add('show');
                clearTimeout(toastEl._hide);
                toastEl._hide = setTimeout(() => toastEl.classList.remove('show'), 2200);
            }

            // ── update certificate from URL ──
            function updateCertificate() {
                const name = getParam('name', 'Recipient');
                const from = getParam('from', 'The Committee');
                const reason = getParam('reason', 'outstanding achievement');

                nameEl.textContent = name;
                fromEl.textContent = '— from ' + from;
                reasonEl.textContent = reason;
                dateEl.textContent = formatDate();

                infoName.textContent = name;
                infoFrom.textContent = from;
                infoReason.textContent = reason;

                // remove loading state
                certEl.classList.remove('loading');
            }

            // ── generate SVG markup ──
            function generateSVG() {
                const name = nameEl.textContent;
                const from = fromEl.textContent.replace('— from ', '');
                const reason = reasonEl.textContent;
                const date = dateEl.textContent;

                const w = 800,
                    h = 1130; // A4-ish ratio
                const pad = 36;
                const innerPad = 24;

                // escape text for SVG
                const esc = str => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,
                '&quot;');

                return `<?xml version="1.0" encoding="UTF-8"?>
            <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
              <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fcf8f0" />
                  <stop offset="100%" stop-color="#f5efe4" />
                </linearGradient>
                <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#c9a84c" />
                  <stop offset="100%" stop-color="#dbb95c" />
                </linearGradient>
              </defs>

              <!-- background -->
              <rect width="${w}" height="${h}" fill="url(#bg)" rx="12" />

              <!-- outer border -->
              <rect x="${pad}" y="${pad}" width="${w - 2*pad}" height="${h - 2*pad}" fill="none"
                    stroke="url(#gold)" stroke-width="3.5" rx="8" />
              <rect x="${pad + 6}" y="${pad + 6}" width="${w - 2*pad - 12}" height="${h - 2*pad - 12}" fill="none"
                    stroke="#e8d5a8" stroke-width="1.2" rx="6" />

              <!-- corners -->
              <g stroke="url(#gold)" stroke-width="4.5" fill="none" stroke-linecap="round">
                <polyline points="${pad + 14},${pad + 4} ${pad + 4},${pad + 4} ${pad + 4},${pad + 14}" />
                <polyline points="${w - pad - 14},${pad + 4} ${w - pad - 4},${pad + 4} ${w - pad - 4},${pad + 14}" />
                <polyline points="${pad + 14},${h - pad - 4} ${pad + 4},${h - pad - 4} ${pad + 4},${h - pad - 14}" />
                <polyline points="${w - pad - 14},${h - pad - 4} ${w - pad - 4},${h - pad - 4} ${w - pad - 4},${h - pad - 14}" />
              </g>

              <!-- seal -->
              <text x="${w/2}" y="${pad + 68}" text-anchor="middle" font-size="56" font-family="Segoe UI, sans-serif">🏅</text>

              <!-- title -->
              <text x="${w/2}" y="${pad + 140}" text-anchor="middle" font-family="Georgia, serif" font-size="48"
                    font-weight="700" fill="#1a2a6c" letter-spacing="6">CERTIFICATE OF ACHIEVEMENT</text>
              <line x1="${w/2 - 160}" y1="${pad + 152}" x2="${w/2 + 160}" y2="${pad + 152}" stroke="url(#gold)" stroke-width="2" />

              <!-- subtitle -->
              <text x="${w/2}" y="${pad + 192}" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22"
                    fill="#5a5a7a" letter-spacing="6" font-weight="400">presented to</text>

              <!-- name -->
              <text x="${w/2}" y="${pad + 268}" text-anchor="middle" font-family="Georgia, serif" font-size="78"
                    font-weight="700" fill="#1a1a2e" letter-spacing="4">${esc(name)}</text>

              <!-- from -->
              <text x="${w/2}" y="${pad + 328}" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28"
                    fill="#3a3a5a">— from <tspan font-weight="600" fill="#1a2a6c">${esc(from)}</tspan></text>

              <!-- reason -->
              <text x="${w/2}" y="${pad + 400}" text-anchor="middle" font-family="Georgia, serif" font-size="34"
                    fill="#2a2a4a" font-style="italic">“${esc(reason)}”</text>

              <!-- date -->
              <line x1="${w/2 - 120}" y1="${pad + 450}" x2="${w/2 + 120}" y2="${pad + 450}" stroke="#ddd" stroke-width="1.2" />
              <text x="${w/2}" y="${pad + 490}" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24"
                    fill="#6a6a8a" letter-spacing="3">${esc(date)}</text>

              <!-- subtle footer line -->
              <line x1="${w/2 - 80}" y1="${h - pad - 40}" x2="${w/2 + 80}" y2="${h - pad - 40}" stroke="#c9a84c" stroke-width="1.2" />
            </svg>`;
            }

            // ── download SVG ──
            function downloadSVG() {
                const svgStr = generateSVG();
                const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'certificate.svg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('✅ SVG downloaded!');
            }

            // ── download JPG (using html2canvas) ──
            function downloadJPG() {
                // show loading state
                certEl.classList.add('loading');

                // Ensure fonts are loaded (simple delay)
                setTimeout(() => {
                    html2canvas(certEl, {
                        scale: 2.5, // high quality
                        useCORS: true,
                        backgroundColor: '#fcf8f0',
                        logging: false,
                        allowTaint: false,
                        width: 800,
                        height: 1130,
                        onclone: function(doc) {
                            // ensure all text is visible
                        }
                    }).then(canvas => {
                        certEl.classList.remove('loading');
                        try {
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                            const a = document.createElement('a');
                            a.href = dataUrl;
                            a.download = 'certificate.jpg';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            showToast('✅ JPG downloaded!');
                        } catch (e) {
                            console.warn('JPG export error:', e);
                            showToast('⚠️ JPG export failed, try SVG');
                            certEl.classList.remove('loading');
                        }
                    }).catch(err => {
                        certEl.classList.remove('loading');
                        console.error('html2canvas error:', err);
                        showToast('⚠️ JPG export error, please try SVG');
                    });
                }, 300);
            }

            // ── init ──
            function init() {
                updateCertificate();

                // event listeners
                downloadSvgBtn.addEventListener('click', downloadSVG);
                downloadJpgBtn.addEventListener('click', downloadJPG);

                // keyboard shortcut: 's' for SVG, 'j' for JPG
                document.addEventListener('keydown', (e) => {
                    if (e.key === 's' && !e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        downloadSVG();
                    } else if (e.key === 'j' && !e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        downloadJPG();
                    }
                });

                // re-generate if URL changes (e.g. back/forward)
                window.addEventListener('popstate', () => {
                    updateCertificate();
                });

                console.log('📜 Certificate ready!');
                console.log('  📥 Press [s] for SVG, [j] for JPG');
            }

            // run when DOM ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
