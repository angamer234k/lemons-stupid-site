<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>mines · lemon</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#0a0a0b;font-family:Inter,system-ui,sans-serif;user-select:none;color:#f5f5f5}
body{background-image:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(253,224,71,.1),transparent);padding-bottom:24px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.back{color:#a1a1aa;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 12px;border-radius:999px;border:1px solid #27272a;background:#111113}
.title{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fde047}
.meta{font-size:.8rem;font-weight:600;color:#a1a1aa}.meta span{color:#fde047}
.stage{display:flex;flex-direction:column;align-items:center;padding:12px;gap:14px}
.board{display:grid;gap:3px;background:#18181b;padding:8px;border-radius:12px;border:1px solid #27272a}
.cell{width:36px;height:36px;border-radius:6px;background:#111113;border:none;color:#e4e4e7;font-weight:700;font-size:.9rem;font-family:inherit}
.cell.open{background:#27272a}.cell.flag{background:#3f3f46;color:#fde047}.cell.mine{background:#e94560;color:#fff}
.cell.c1{color:#60a5fa}.cell.c2{color:#4ade80}.cell.c3{color:#f87171}.cell.c4{color:#c084fc}
.bar{display:flex;gap:10px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #27272a;background:#18181b;color:#fde047;font-weight:600;font-family:inherit}
.btn.on{background:#fde047;color:#0a0a0b;border-color:#fde047}
.hint{text-align:center;color:#52525b;font-size:.75rem;padding:8px}
</style></head><body>
<header><a class="back" href="/games.html">← games</a><div class="title">mines</div><div class="meta">mines <span id="left">10</span></div></header>
<div class="stage"><div class="board" id="b"></div>
<div class="bar"><button class="btn" id="mode">flag off</button><button class="btn" id="new">new</button></div></div>
<div class="hint">tap to dig · toggle flag mode</div>
<script>
(function(){
const R=9,C=9,M=10;let grid,open,flags,flagMode=false,dead=false,started=false;
const b=document.getElementById('b');b.style.gridTemplateColumns='repeat('+C+',36px)';
function init(){grid=[];open=[];flags=[];dead=false;started=false;flagMode=false;
document.getElementById('mode').textContent='flag off';document.getElementById('mode').classList.remove('on');
for(let i=0;i<R;i++){grid[i]=[];open[i]=[];flags[i]=[];for(let j=0;j<C;j++){grid[i][j]=0;open[i][j]=false;flags[i][j]=false}}
render();document.getElementById('left').textContent=M}
function place(si,sj){let n=0;while(n<M){const i=Math.floor(Math.random()*R),j=Math.floor(Math.random()*C);
if(grid[i][j]===-1||(i===si&&j===sj))continue;grid[i][j]=-1;n++}
for(let i=0;i<R;i++)for(let j=0;j<C;j++){if(grid[i][j]===-1)continue;let c=0;
for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const ni=i+di,nj=j+dj;if(ni>=0&&nj>=0&&ni<R&&nj<C&&grid[ni][nj]===-1)c++}grid[i][j]=c}}
function flood(i,j){if(i<0||j<0||i>=R||j>=C||open[i][j]||flags[i][j])return;open[i][j]=true;
if(grid[i][j]===0)for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++)flood(i+di,j+dj)}
function click(i,j){if(dead||open[i][j])return;
if(flagMode){if(!open[i][j]){flags[i][j]=!flags[i][j];render()}return}
if(flags[i][j])return;
if(!started){place(i,j);started=true}
if(grid[i][j]===-1){dead=true;for(let a=0;a<R;a++)for(let c=0;c<C;c++)if(grid[a][c]===-1)open[a][c]=true;render();setTimeout(function(){alert('boom')},50);return}
flood(i,j);render();
let safe=0;for(let a=0;a<R;a++)for(let c=0;c<C;c++)if(open[a][c])safe++;
if(safe===R*C-M){dead=true;setTimeout(function(){alert('clear')},50)}}
function render(){b.innerHTML='';let f=0;
for(let i=0;i<R;i++)for(let j=0;j<C;j++){const btn=document.createElement('button');btn.className='cell';btn.type='button';
if(flags[i][j]){btn.classList.add('flag');btn.textContent='F';f++}
else if(open[i][j]){btn.classList.add('open');if(grid[i][j]===-1){btn.classList.add('mine');btn.textContent='*'}
else if(grid[i][j]>0){btn.textContent=grid[i][j];btn.classList.add('c'+Math.min(4,grid[i][j]))}}
btn.onclick=function(){click(i,j)};b.appendChild(btn)}
document.getElementById('left').textContent=Math.max(0,M-f)}
document.getElementById('mode').onclick=function(){flagMode=!flagMode;this.textContent=flagMode?'flag on':'flag off';this.classList.toggle('on',flagMode)};
document.getElementById('new').onclick=init;init()})();
</script></body></html>
